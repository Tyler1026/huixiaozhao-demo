/* 用 emoji 兜底替代 Phosphor 图标字体 */
.i{font-style:normal;font-size:1em}
/* 城市智库回答的调用来源标签 */
.answer-sources{margin-top:10px;padding-top:9px;border-top:1px dashed #d8e0ed;font-size:11px;color:#667590}
.answer-sources em{font-style:normal;color:#8490a5;margin-right:4px}
.answer-sources span{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;background:#eef3fb;border:1px solid #d8e4f3;border-radius:5px;color:#013582;font-size:10.5px}
.answer-note{margin-top:8px;font-size:10.5px;color:#a34c09;line-height:1.5}

/* ===== 紧凑化 override：更像常规 web 后台（收窄尺寸/字号/留白）===== */
:root{--sidebar-width:212px;--detail-width:340px;--topbar-height:56px;--radius-md:8px;--radius-lg:10px}
.brand-block strong{font-size:16px;line-height:20px}
.brand-block span{font-size:11px;line-height:15px}
.brand-block img{width:34px;height:34px}
.org-block strong{font-size:15px;line-height:20px}
.org-block i{font-size:15px}
.top-meta{gap:20px;padding:0 20px}
.top-meta span{font-size:12px}
.top-meta i{font-size:14px}
.sidebar{padding:14px 10px}
.nav-item{min-height:48px;padding:8px 12px;gap:11px}
.nav-item>i{flex:0 0 20px;width:20px;font-size:19px}
.nav-copy strong{font-size:14px;line-height:19px}
.nav-copy small{font-size:11px;line-height:15px}
.nav-list{gap:5px}
.context-bar{min-height:56px;padding:12px 24px}
.context-bar strong{font-size:14px}
.context-bar div span{font-size:12px}
.conversation-scroll{padding:22px 28px 18px}
.message{gap:11px;margin:0 0 15px}
.message>img{flex:0 0 36px;width:36px;height:36px}
.message-bubble{width:min(560px,calc(100% - 50px));padding:13px 16px;font-size:13.5px;border-radius:10px}
.prompt-list{width:min(600px,calc(100% - 50px));gap:9px;margin:0 0 20px 47px}
.prompt-row{min-height:56px;padding:9px 14px;gap:12px}
.prompt-row strong{font-size:14px;line-height:20px}
.prompt-row small{font-size:11.5px;line-height:17px}
.prompt-row>i:first-child{font-size:20px}
.composer-wrap{padding:0 24px 16px}
.composer{min-height:120px;padding:13px 15px 46px;border-radius:10px}
.composer textarea{height:44px;font-size:13.5px}
.send-button{width:40px;height:40px;right:14px;bottom:13px}
.send-button i{font-size:18px}
.page-header{min-height:84px;padding:18px 24px}
.page-header h1{font-size:20px;line-height:27px}
.page-header p{font-size:12.5px;margin-top:4px}
.knowledge-scroll{padding:20px 24px}
.topic-grid{gap:9px;margin:0 0 18px 0}
.topic-row{min-height:64px;padding:11px 13px}
.topic-row strong{font-size:13.5px}
/* 详情栏紧凑 */
.detail-header{min-height:64px;padding:18px 44px 14px 22px}
.detail-header h2{font-size:17px;line-height:23px}
.detail-scroll{padding:2px 22px 18px}
.detail-block{padding:15px 0}
.detail-block h3{font-size:12.5px;margin-bottom:10px}
/* 进度条：从底部通栏改为紧凑，降低视觉突兀 */
:root{--progress-height:64px}
.progress-footer{padding:0 28px}
.progress-node{flex:0 0 26px;width:26px;height:26px;font-size:11px}
.progress-copy strong{font-size:11.5px}
.progress-copy small{font-size:9px}
.report-document{padding:22px 26px}
.report-section{padding:18px 0;gap:12px}
.report-section h2{font-size:15px;line-height:22px}
.report-section p{font-size:12.5px}

/* 演示用 role 切换按钮（政府端⇄管理端）*/
.role-switch{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;align-self:center;margin:0 16px 0 8px;min-height:34px;padding:0 14px;border:1px solid var(--blue);border-radius:18px;color:var(--blue);background:#fff;cursor:pointer;font-size:12.5px;font-weight:600;white-space:nowrap;transition:background .15s,color .15s}
.role-switch:hover{background:var(--blue);color:#fff}
.role-switch i{font-size:15px}
body.ops-mode .role-switch{border-color:#3a6ea5;color:#dbe6f5;background:#17294a}
body.ops-mode .role-switch:hover{background:#0757ad;color:#fff;border-color:#0757ad}

/* ops-mode 数据后台风格 */
/* ========================================================= */
/* ===== 管理端「数据后台」风格 override（仅 role=ops）===== */
/* 只作用于 body.ops-mode，不影响政府端                    */
/* ========================================================= */
body.ops-mode{--line:#e3e8f0;--line-soft:#eef1f6}
body.ops-mode .app-shell{background:#f5f7fa}
body.ops-mode .topbar{background:#fff;border-bottom:1px solid #e3e8f0}
body.ops-mode .sidebar{background:#0f1f3d;padding:12px 10px}
body.ops-mode .sidebar .nav-item{color:#aeb9cc;border-radius:8px}
body.ops-mode .sidebar .nav-item strong{color:#e8edf5;font-weight:600}
body.ops-mode .sidebar .nav-item small{color:#7686a3}
body.ops-mode .sidebar .nav-item:hover{background:#17294a}
body.ops-mode .sidebar .nav-item.active{background:#0757ad}
body.ops-mode .sidebar .nav-item.active strong,body.ops-mode .sidebar .nav-item.active small{color:#fff}
body.ops-mode .system-status{color:#7686a3;border-top:1px solid #1c2f52;margin-top:8px;padding-top:10px}
body.ops-mode .main-pane{background:#f5f7fa}
body.ops-mode .page-header{background:#fff;border-bottom:1px solid #e3e8f0}
body.ops-mode .knowledge-scroll,body.ops-mode .clues-scroll,body.ops-mode .settings-scroll,body.ops-mode .docking-scroll,body.ops-mode .report-scroll{padding:18px 22px}

/* 通用卡片容器 */
body.ops-mode .ops-card{background:#fff;border:1px solid #e3e8f0;border-radius:10px;box-shadow:0 1px 2px rgba(16,31,61,.04)}
body.ops-mode .ops-card+.ops-card{margin-top:12px}

/* KPI 磁贴 */
body.ops-mode .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
body.ops-mode .kpi-tile{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:14px 16px;box-shadow:0 1px 2px rgba(16,31,61,.04)}
body.ops-mode .kpi-tile .kpi-label{font-size:11.5px;color:#8490a5;display:flex;align-items:center;gap:5px}
body.ops-mode .kpi-tile .kpi-value{font-size:26px;font-weight:750;color:#0b183b;line-height:1.15;margin-top:6px;letter-spacing:-.5px}
body.ops-mode .kpi-tile .kpi-sub{font-size:11px;color:#9aa5b5;margin-top:2px}
body.ops-mode .kpi-tile.accent{border-top:3px solid #0757ad}
body.ops-mode .kpi-tile.teal{border-top:3px solid #007f82}
body.ops-mode .kpi-tile.orange{border-top:3px solid #c85b09}

/* 数据表格 */
body.ops-mode .ops-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e3e8f0;border-radius:10px;overflow:hidden;font-size:13px}
body.ops-mode .ops-table thead th{background:#f1f4f9;color:#5e6d82;font-weight:600;font-size:11.5px;text-align:left;padding:10px 14px;border-bottom:1px solid #e3e8f0;white-space:nowrap}
body.ops-mode .ops-table tbody td{padding:11px 14px;border-bottom:1px solid #eef1f6;color:#253653;vertical-align:middle}
body.ops-mode .ops-table tbody tr:last-child td{border-bottom:0}
body.ops-mode .ops-table tbody tr:hover{background:#f7f9fc}
body.ops-mode .ops-table .row-click{cursor:pointer}

/* 看板列（对接管理） */
body.ops-mode .kanban{display:flex;gap:12px;align-items:flex-start}

function detailPane(p){

  else if(detailData&&detailData.kind==='clue'){body=detailClue(detailData.d);}
  else if(detailData&&detailData.kind==='sub'){body=detailSub(detailData.d);}
  else if(view==='home'){body=detailNeeds(p);}       // 项目管理→需求概览
  else if(view==='docking'){body=detailDocking(p);}   // 政企对接→对接概览
  else if(view==='settings'){body=detailSettings(p);}
  else if(view==='knowledge'){body=detailKbIntro(p);}

    '<div class="detail-page">'+body+'</div>';

function startFlow(mode){

  var p=P();

             verify:'帮我核验几家目标企业是否值得招引'}[mode];

      '<div style="font-size:13px;font-weight:650;color:#0b183b;margin-bottom:8px">🔄 报告来回优化</div>'+
      '<div style="font-size:11.5px;color:#667590;margin-bottom:8px">补充材料或指出问题，我会<strong>结合你的补充重新生成一份完整报告</strong>（保留历史版本）；也可点每条「✎ 修正此条」直接人工改写。</div>'+
      '<textarea id="patchInput" placeholder="例如：补充——楚胜汽车园区可承接；或：第2条判断有误，电控本地已有供应…" style="width:100%;min-height:52px;border:1px solid #cdd8e8;border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;resize:vertical;box-sizing:border-box"></textarea>'+
      '<div style="display:flex;gap:8px;margin-top:9px"><button class="primary-button" style="flex:0 0 auto" onclick="applyPatch()">🔄 结合补充重新生成</button>'+
      '<button class="ghost-button" onclick="finalizeReport()">🔒 报告定稿</button></div>'+
    '</div>';
  var confirmArea=st.finalized?
    ('<div class="detail-actions-stack" style="border:0;padding:16px 0 0">'+
      '<div class="confirm-row" onclick="cadreOK(this)"><input type="checkbox" id="ck1"><span><strong>干部确认</strong><small>确认判断准确、需求成立</small></span></div>'+

// 双确认 == 从研判进入项目管理的唯一关口：通过后报告的「补链方向」自动派生为项目
/* 跨端桥接：政府端双确认递交 → upsert 一条管理端需求池记录（黄金演示动线第1→2步） */
function syncDemandFromProject(){
  var p=P();if(!p)return;
  var cl=p.clues||[];
  var domain=(cl[0]&&(cl[0].dir||'').split(' · ')[0])||p.topic.replace('补链','').replace('升级','').replace('智能化','');
  var exist=DEMANDS.find(function(d){return d.city===p.city&&d.topic===p.topic});
  var payload={
    city:p.city, gov:p.org+'·'+p.who, topic:p.topic, domain:domain,
    need:cl.map(function(c){return c.dir.split(' · ')[0]}).join(' / ')||p.topic,
    submit:'刚刚', res:'checking', resLabel:'核验中', clues:cl.length,
    note:'政府端双确认递交，等待资源端核验匹配。', fromGov:true
  };
  if(exist){Object.keys(payload).forEach(function(k){if(k!=='res'&&k!=='resLabel'&&k!=='clues')exist[k]=payload[k];});exist.submit='刚刚';}
  else{payload.id='dg'+Date.now();DEMANDS.unshift(payload);}
  // 更新城市漏斗（提交+确认各+1；若该城市不存在则新建）
  var f=CITY_FUNNEL.find(function(x){return x.city===p.city});
  if(f){f.submit++;f.confirm++;}else{CITY_FUNNEL.push({city:p.city,submit:1,confirm:1,match:0,dock:0,sign:0});}
}
function submitNeed(){
  setStage(3);
  var cl=P().clues||[];var n=cl.length;
  syncDemandFromProject();
  // 【自动派生项目】把报告里每个补链方向变成一个招引项目，挂到当前产业方向下（去重）
  if(!SUBPROJ[cur])SUBPROJ[cur]=[];
  var made=0;
  cl.forEach(function(c){
    if(SUBPROJ[cur].some(function(m){return m.name===c.dir}))return;
    SUBPROJ[cur].push({name:c.dir,dir:c.dir,clueName:c.name,stage:4,from:P().topic});
    made++;
  });
  saveSubproj();
  if(n===0){
    // 无补链方向可派生（Ryan：高概率一家都没有）——需求仍进入资源池
    addA('<p>✅ 双确认完成，已生成<strong>正式招商需求</strong>并递交资源端。</p>');
    addRaw('<div class="clue-origin"><i class="i">🔗</i>需求已递交<button onclick="scrollToReport()">查看报告</button></div>'+
      '<div style="border:1px dashed #cdd8e8;border-radius:10px;padding:20px;text-align:center;background:#fafbfd">'+
        '<div style="font-size:26px;margin-bottom:6px">📭</div>'+
        '<div style="font-size:13.5px;font-weight:650;color:#0b183b">报告暂无明确补链方向</div>'+
        '<div style="font-size:12px;color:#667590;margin-top:6px;line-height:1.7">需求已进入资源池，资源端将持续核验可触达渠道，有匹配会通知你。</div>'+
        '<div style="margin-top:12px"><span class="status-tag" style="background:#fff0de;color:#a34c09">已纳入长期跟踪</span></div>'+
      '</div>'+
      '<div class="boundary-note"><i class="i">ℹ</i>无匹配也是有效结果——资源端会据此对接外部渠道，或等待新资源进入。</div>');
    setStage(4);
    setTimeout(function(){addRaw(dockPanel());setStage(5);},700);
    return;
  }
  addA('<p>✅ 双确认完成，已生成<strong>正式招商需求</strong>。系统已把报告的 <strong>'+n+' 个补链方向自动建成招引项目</strong>，挂在「项目管理 › '+P().topic+'」下，可分别推进对接——</p>');
  addRaw('<div class="clue-origin"><i class="i">🔗</i>项目由报告补链方向自动派生<button onclick="scrollToReport()">查看报告</button></div>'+
    '<div class="clue-list">'+cl.map(function(c,i){return '<div class="clue-row" onclick="go(\'home\');setTimeout(function(){toggleProjGroup(\''+cur+'\')},60)"><div class="clue-icon"><i class="i">🎯</i></div>'+
      '<div class="clue-main"><strong>'+c.dir.split(' · ')[0]+'</strong><small>候选线索 '+c.name+'</small><em>已建为项目 · 点击到「项目管理」查看</em></div>'+
      '<span class="status-tag" style="background:#ebf3fd;color:#013582">已建项目</span><i class="i">➜</i></div>';}).join('')+'</div>'+
    '<div style="margin-top:10px"><button class="primary-button" onclick="go(\'home\');setTimeout(function(){toggleProjGroup(\''+cur+'\')},60)"><i class="i">📋</i>前往项目管理查看 '+n+' 个项目</button></div>'+
    '<div class="boundary-note"><i class="i">ℹ</i>项目自动生成后即为独立对接线；候选企业由资源端核验可达性，系统不自动联系企业。</div>');
  setStage(4);
  setTimeout(function(){addRaw(dockPanel());setStage(5);},700);

// 导出报告：生成完整研判报告文件并下载
function exportReport(){
  var p=P();var r=p.report;if(!r){toast('请先生成报告');return;}
  var now=new Date().toLocaleString('zh-CN');var L=[];
  L.push(r.title);
  L.push('导出时间：'+now+'　|　编制：'+p.org+' · '+p.who);
  L.push('数据来源：'+p.city+'城市智库 + 公开信息（更新至 7月20日 06:00）');
  L.push('====================================================\n');
  L.push('【摘要】');L.push(r.lead+'\n');
  L.push('【关键指标】');r.summary.forEach(function(s){L.push('  '+s[0]+'：'+s[1])});L.push('');
  L.push('【研判结论】');
  r.sections.forEach(function(s,i){
    L.push('  '+(i+1)+'、'+s.h+'　['+(s.type==='virt'?'待核实':'实据')+']');
    L.push('     '+s.p);
    L.push('     依据来源：'+s.ev);
    if(s.chk)L.push('     ⚠ 仍需确认：'+s.chk);
    L.push('');
  });
  L.push('----------------------------------------------------');
  L.push('确认状态：需经 干部确认 → 授权领导确认 后方可正式递交');
  L.push('使用边界：'+r.footnote);
  L.push('====================================================');
  L.push('本报告由慧小招根据城市智库与公开信息自动生成，供招商研判参考；正式对接前需政府授权材料确认。');
  var blob=new Blob([L.join('\n')],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=r.title+'.txt';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  toast('报告已导出：'+r.title);
}

function matchDemand(){
  // 默认取第一条"非暂无资源"的需求；用户可切换
  if(matchDemandId){var f=DEMANDS.find(function(x){return x.id===matchDemandId});if(f)return f;}
  return DEMANDS.find(function(x){return x.res!=='none'})||DEMANDS[0];
}
function setMatchDemand(id){matchDemandId=id;render()}

  }else if(pool.length===0){
    var _bg1=d.domain.indexOf('电堆')>-1?'电堆/储氢/空压机（随州整车成本53%缺口）':d.domain.indexOf('无人机')>-1||d.domain.indexOf('机器人')>-1?'应急机器人/无人机/5G通信（随州感知层外采依赖）':'香菇多糖/多肽提取/菌种研发（随州精深加工空白）';

  }else{
