/* 用 emoji 兜底替代 Phosphor 图标字体 */
.i{font-style:normal;font-size:1em}
/* 城市智库回答的调用来源标签 */
.answer-sources{margin-top:10px;padding-top:9px;border-top:1px dashed #d8e0ed;font-size:11px;color:#667590}
.answer-sources em{font-style:normal;color:#8490a5;margin-right:4px}
.answer-sources span{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;background:#eef3fb;border:1px solid #d8e4f3;border-radius:5px;color:#013582;font-size:10.5px}
.answer-note{margin-top:8px;font-size:10.5px;color:#a34c09;line-height:1.5}

/* ===== 紧凑化 override：更像常规 web 后台（收窄尺寸/字号/留白）===== */
:root{--sidebar-width:212px;--detail-width:340px;--topbar-height:56px;--radius-md:8px;--radius-lg:10px}
.brand-block strong{font-size:16px;line-height:20px}
.brand-block span{font-size:11px;line-height:15px}
.brand-block img{width:34px;height:34px}
.org-block strong{font-size:15px;line-height:20px}
.org-block i{font-size:15px}
.top-meta{gap:20px;padding:0 20px}
.top-meta span{font-size:12px}
.top-meta i{font-size:14px}
.sidebar{padding:14px 10px}
.nav-item{min-height:48px;padding:8px 12px;gap:11px}
.nav-item>i{flex:0 0 20px;width:20px;font-size:19px}
.nav-copy strong{font-size:14px;line-height:19px}
.nav-copy small{font-size:11px;line-height:15px}
.nav-list{gap:5px}
.context-bar{min-height:56px;padding:12px 24px}
.context-bar strong{font-size:14px}
.context-bar div span{font-size:12px}
.conversation-scroll{padding:22px 28px 18px}
.message{gap:11px;margin:0 0 15px}
.message>img{flex:0 0 36px;width:36px;height:36px}
.message-bubble{width:min(560px,calc(100% - 50px));padding:13px 16px;font-size:13.5px;border-radius:10px}
.prompt-list{width:min(600px,calc(100% - 50px));gap:9px;margin:0 0 20px 47px}
.prompt-row{min-height:56px;padding:9px 14px;gap:12px}
.prompt-row strong{font-size:14px;line-height:20px}
.prompt-row small{font-size:11.5px;line-height:17px}
.prompt-row>i:first-child{font-size:20px}
.composer-wrap{padding:0 24px 16px}
.composer{min-height:120px;padding:13px 15px 46px;border-radius:10px}
.composer textarea{height:44px;font-size:13.5px}
.send-button{width:40px;height:40px;right:14px;bottom:13px}
.send-button i{font-size:18px}
.page-header{min-height:84px;padding:18px 24px}
.page-header h1{font-size:20px;line-height:27px}
.page-header p{font-size:12.5px;margin-top:4px}
.knowledge-scroll{padding:20px 24px}
.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 18px 0}
.topic-row{min-height:80px;padding:14px 16px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;height:auto}
.topic-row strong{font-size:13.5px}
/* 详情栏紧凑 */
.detail-header{min-height:64px;padding:18px 44px 14px 22px}
.detail-header h2{font-size:17px;line-height:23px}
.detail-scroll{padding:2px 22px 18px}
.detail-block{padding:15px 0}
.detail-block h3{font-size:12.5px;margin-bottom:10px}
/* 进度条：从底部通栏改为紧凑，降低视觉突兀 */
:root{--progress-height:64px}
.progress-footer{padding:0 28px}
.progress-node{flex:0 0 26px;width:26px;height:26px;font-size:11px}
.progress-copy strong{font-size:11.5px}
.progress-copy small{font-size:9px}
.report-document{padding:22px 26px}
.report-section{padding:18px 0;gap:12px}
.report-section h2{font-size:15px;line-height:22px}
.report-section p{font-size:12.5px}

/* 演示用 role 切换按钮（政府端⇄管理端）*/
.role-switch{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;align-self:center;margin:0 16px 0 8px;min-height:34px;padding:0 14px;border:1px solid var(--blue);border-radius:18px;color:var(--blue);background:#fff;cursor:pointer;font-size:12.5px;font-weight:600;white-space:nowrap;transition:background .15s,color .15s}
.role-switch:hover{background:var(--blue);color:#fff}
.role-switch i{font-size:15px}
body.ops-mode .role-switch{border-color:#3a6ea5;color:#dbe6f5;background:#17294a}
body.ops-mode .role-switch:hover{background:#0757ad;color:#fff;border-color:#0757ad}

/* ops-mode 数据后台风格 */
/* ========================================================= */
/* ===== 管理端「数据后台」风格 override（仅 role=ops）===== */
/* 只作用于 body.ops-mode，不影响政府端                    */
/* ========================================================= */
body.ops-mode{--line:#e3e8f0;--line-soft:#eef1f6}
body.ops-mode .app-shell{background:#f5f7fa}
body.ops-mode .topbar{background:#fff;border-bottom:1px solid #e3e8f0}
body.ops-mode .sidebar{background:#0f1f3d;padding:12px 10px}
body.ops-mode .sidebar .nav-item{color:#aeb9cc;border-radius:8px}
body.ops-mode .sidebar .nav-item strong{color:#e8edf5;font-weight:600}
body.ops-mode .sidebar .nav-item small{color:#7686a3}
body.ops-mode .sidebar .nav-item:hover{background:#17294a}
body.ops-mode .sidebar .nav-item.active{background:#0757ad}
body.ops-mode .sidebar .nav-item.active strong,body.ops-mode .sidebar .nav-item.active small{color:#fff}
body.ops-mode .system-status{color:#7686a3;border-top:1px solid #1c2f52;margin-top:8px;padding-top:10px}
body.ops-mode .main-pane{background:#f5f7fa}
body.ops-mode .page-header{background:#fff;border-bottom:1px solid #e3e8f0}
body.ops-mode .knowledge-scroll,body.ops-mode .clues-scroll,body.ops-mode .settings-scroll,body.ops-mode .docking-scroll,body.ops-mode .report-scroll{padding:18px 22px}

/* 通用卡片容器 */
body.ops-mode .ops-card{background:#fff;border:1px solid #e3e8f0;border-radius:10px;box-shadow:0 1px 2px rgba(16,31,61,.04)}
body.ops-mode .ops-card+.ops-card{margin-top:12px}

/* KPI 磁贴 */
body.ops-mode .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
body.ops-mode .kpi-tile{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:14px 16px;box-shadow:0 1px 2px rgba(16,31,61,.04)}
body.ops-mode .kpi-tile .kpi-label{font-size:11.5px;color:#8490a5;display:flex;align-items:center;gap:5px}
body.ops-mode .kpi-tile .kpi-value{font-size:26px;font-weight:750;color:#0b183b;line-height:1.15;margin-top:6px;letter-spacing:-.5px}
body.ops-mode .kpi-tile .kpi-sub{font-size:11px;color:#9aa5b5;margin-top:2px}
body.ops-mode .kpi-tile.accent{border-top:3px solid #0757ad}
body.ops-mode .kpi-tile.teal{border-top:3px solid #007f82}
body.ops-mode .kpi-tile.orange{border-top:3px solid #c85b09}

/* 数据表格 */
body.ops-mode .ops-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e3e8f0;border-radius:10px;overflow:hidden;font-size:13px}
body.ops-mode .ops-table thead th{background:#f1f4f9;color:#5e6d82;font-weight:600;font-size:11.5px;text-align:left;padding:10px 14px;border-bottom:1px solid #e3e8f0;white-space:nowrap}
body.ops-mode .ops-table tbody td{padding:11px 14px;border-bottom:1px solid #eef1f6;color:#253653;vertical-align:middle}
body.ops-mode .ops-table tbody tr:last-child td{border-bottom:0}
body.ops-mode .ops-table tbody tr:hover{background:#f7f9fc}
body.ops-mode .ops-table .row-click{cursor:pointer}

/* 看板列（对接管理） */

  // renderMd 是 triggerReport 内的局部函数，这里内联一个简化版
  function md(t){

      .replace(/^#{0,3}\s*([一二三四五六七八九十]+)[、]\s*(.+)$/gm,
        '<div style="display:flex;align-items:center;gap:10px;margin:20px 0 8px;padding-bottom:7px;border-bottom:2px solid #1a56db">'+
        '<span style="display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;background:#1a56db;color:#fff;border-radius:50%;font-size:12px;font-weight:700">$1</span>'+
        '<span style="font-size:14px;font-weight:750;color:#0b183b">$2</span></div>')
      .replace(/^\|(.+)\|$/gm,function(m,inner){
        var cells=inner.split('|').map(function(c){return c.trim();});
        if(cells.every(function(c){return /^[\s\-:]+$/.test(c);})) return '';
        return '<tr>'+cells.map(function(c,ci){
          return ci===0
            ? '<th style="padding:8px 12px;background:#f0f4ff;border:1px solid #dbeafe;font-weight:700;color:#1e3a8a;text-align:left">'+c+'</th>'
            : '<td style="padding:8px 12px;border:1px solid #e8edf5;color:#1e293b">'+c+'</td>';
        }).join('')+'</tr>';
      })
      .replace(/(<tr>[\s\S]+?<\/tr>)+/g,'<table style="width:100%;border-collapse:collapse;margin:10px 0;font-size:12.5px">$&</table>')
      .replace(/^[-•]\s(.+)$/gm,'<li style="margin:4px 0;color:#1e293b">$1</li>')
      .replace(/\n{2,}/g,'</p><p style="margin:6px 0;line-height:1.85;color:#1e293b">')
      .replace(/\n/g,'<br>');
  }

  setReportAreaHtml(area,
    '<div style="border-radius:14px;border:1.5px solid #bfdbfe;overflow:hidden;margin-bottom:8px">'+
      '<div style="padding:12px 16px;background:#f8faff;border-bottom:1px solid #e8edf5;display:flex;align-items:center;gap:8px">'+
        '<span style="font-size:13px;font-weight:700;color:#1d4ed8">📊 产业分析报告（完整版）</span>'+

/* ── 下载报告 ── */
/* 报告 Markdown → 专业排版 HTML（自包含，供 PDF 打印用） */
function reportMdToHtml(md){
  if(!md) return '';
  md=md.replace(/\r\n/g,'\n').replace(/\n{3,}/g,'\n\n');
  var lines=md.split('\n'), out=[], i=0, inTable=false, tbuf=[];
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function inline(s){
    s=esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    // 关键数据高亮
    s=s.replace(/(\d[\d,.]*\s*(?:亿元|亿|万辆|万吨|万㎡|万台|GWh|km|kg|%))/g,'<span class="num">$1</span>');
    s=s.replace(/✅/g,'<span class="ok">✅</span>').replace(/❌/g,'<span class="no">❌</span>').replace(/⚠️/g,'<span class="warn">⚠️</span>');
    return s;
  }
  function flushTable(){
    if(!tbuf.length){inTable=false;return;}
    var rows=tbuf.filter(function(r){return !/^[\s\-:|]+$/.test(r);});
    var html='<table><thead>';
    rows.forEach(function(r,ri){
      var cells=r.replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim();});
      // 跳过分隔行
      if(cells.every(function(c){return /^[\s\-:]*$/.test(c);})) return;
      var tag=ri===0?'th':'td';
      html+=(ri===0?'':'')+'<tr>'+cells.map(function(c){return '<'+tag+'>'+inline(c)+'</'+tag+'>';}).join('')+'</tr>';
      if(ri===0)html+='</thead><tbody>';
    });
    html+='</tbody></table>';
    out.push(html); tbuf=[]; inTable=false;
  }
  for(;i<lines.length;i++){
    var ln=lines[i];
    if(/^\s*\|.*\|\s*$/.test(ln)){ inTable=true; tbuf.push(ln); continue; }
    else if(inTable){ flushTable(); }
    var mh=ln.match(/^(#{1,4})\s+(.*)$/);
    if(mh){ var lv=mh[1].length; out.push('<h'+lv+'>'+inline(mh[2])+'</h'+lv+'>'); continue; }
    var mch=ln.match(/^\s*[一二三四五六七八九十]+、/);
    if(mch){ out.push('<h2>'+inline(ln.trim())+'</h2>'); continue; }
    var mli=ln.match(/^\s*[-•]\s+(.*)$/);
    if(mli){
      if(out.length&&out[out.length-1].slice(-5)==='</ul>'){ out[out.length-1]=out[out.length-1].slice(0,-5)+'<li>'+inline(mli[1])+'</li></ul>'; }
      else out.push('<ul><li>'+inline(mli[1])+'</li></ul>');
      continue;
    }
    if(ln.trim()==='') continue;
    out.push('<p>'+inline(ln.trim())+'</p>');
  }
  if(inTable) flushTable();
  return out.join('\n');
}

    '.cover h1{font-size:30px;font-weight:800;color:#0b183b;margin:0 0 10px;letter-spacing:-.5px}'+
    '.cover .subtitle{font-size:15px;color:#4a5568;margin-bottom:32px}'+
    '.cover .meta{display:flex;gap:32px;flex-wrap:wrap;font-size:12px;color:#667590}'+
    '.cover .meta b{display:block;color:#0b183b;font-size:15px;font-weight:700;margin-top:3px}'+

var PROJECTS={};














































































































































var STAGES=[['资料准备','上传与授权材料'],['AI 研判','生成缺口与方向'],['确认需求','双确认'],['资源匹配','资源端核验匹配'],['招商对接','安排正式沟通']];

/* 项目级阶段链：标准5阶段 + 该项目自定义追加阶段（客户反馈第4章第3条：后续阶段不写死） */
function projStages(p){
  var base=STAGES.map(function(s){return s.slice();});
  if(p && p.customStages && p.customStages.length){
    for(var i=0;i<p.customStages.length;i++) base.push([p.customStages[i],'自定义阶段']);
  }
  return base;
}
function stageNameOf(p,n){
  var st=projStages(p);
  return (n>=1 && st[n-1]) ? st[n-1][0] : '完成';
}
function stageDescOf(p,n){
  var st=projStages(p);
  return (n>=1 && st[n-1]) ? st[n-1][1] : '';
}

/* 前台时间线：读项目 stageLog 留痕动态渲染，区分已完成/当前进行中/下一步 */
function stageTimelineHtml(p){
  if(!p) return '';
  var st = projStages(p);
  var cur = p.stage || 1;
  var log = (p.stageLog || []).slice();
  // 尚未进入对接流程（阶段1-2为分析阶段）
  if(cur < 3){
    return '<div style="display:flex;gap:12px">'+
      '<div style="display:flex;flex-direction:column;align-items:center">'+
        '<div style="width:28px;height:28px;border-radius:50%;background:#f0f4ff;border:2px solid #e8edf5;display:flex;align-items:center;justify-content:center;color:#9aa5b5;font-size:12px;flex-shrink:0">◔</div>'+
      '</div>'+
      '<div style="padding:2px 0 16px">'+
        '<div style="font-size:13px;font-weight:650;color:#9aa5b5">尚未进入招商对接流程</div>'+
        '<div style="font-size:12px;color:#b0bac8;margin-top:2px">完成研判与方向确认后提交招商需求即进入</div>'+
      '</div>'+
    '</div>';
  }
  // 已完成阶段：stageLog 中 to < cur 的阶段（去重，旧→新）
  var doneStages = [];
  log.slice().reverse().forEach(function(l){
    if(l.to < cur && doneStages.indexOf(l.to) < 0) doneStages.push(l.to);
  });
  var nodes = [];
  // 固定起点：需求已递交
  nodes.push({title:'需求已递交', desc:'已同步招商需求与报告证据链', state:'done', note:'', time:null});
  // 已完成推进阶段
  doneStages.forEach(function(toStage){
    var entry = null;
    for(var i=0;i<log.length;i++){ if(log[i].to===toStage){ entry=log[i]; break; } }
    nodes.push({
      title: stageNameOf(p, toStage),
      desc: entry && entry.note ? entry.note : '',
      state:'done', note:'', time: entry ? entry.ts : null
    });
  });
  // 当前阶段（含该阶段的最新回复说明）
  var curEntry = null;
  for(var ci=0;ci<log.length;ci++){ if(log[ci].to===cur){ curEntry=log[ci]; break; } }
  nodes.push({title: stageNameOf(p, cur), desc:(curEntry&&curEntry.note)?curEntry.note:'当前进行中', state:'current', note:'', time: curEntry?curEntry.ts:null});
  // 下一步
  var next = cur + 1;
  if(next <= st.length){
    nodes.push({title: stageNameOf(p, next), desc:'下一步（等待资源端推进）', state:'next', note:'', time:null});
  }
  // 渲染
  return nodes.map(function(nd, i){
    var isLast = (i === nodes.length - 1);
    var dotBg = nd.state==='done' ? '#1a56db' : nd.state==='current' ? '#f59e0b' : '#f0f4ff';
    var dotBorder = nd.state==='next' ? 'border:2px solid #e8edf5;' : '';
    var dotColor = nd.state==='next' ? '#9aa5b5' : '#fff';
    var dotText = nd.state==='done' ? '✓' : nd.state==='current' ? '◔' : (nd.state==='next' ? '' : '');
    var titleColor = nd.state==='next' ? '#9aa5b5' : '#0b183b';
    var timeHtml = nd.time ? '<span style="font-size:10px;color:#9aa5b5;margin-left:8px">'+new Date(nd.time).toLocaleString('zh-CN')+'</span>' : '';
    return '<div style="display:flex;gap:12px">'+
      '<div style="display:flex;flex-direction:column;align-items:center">'+
        '<div style="width:28px;height:28px;border-radius:50%;background:'+dotBg+';'+dotBorder+'display:flex;align-items:center;justify-content:center;color:'+dotColor+';font-size:12px;flex-shrink:0">'+dotText+'</div>'+
        (isLast?'':'<div style="width:2px;flex:1;background:#e8edf5;margin:4px 0"></div>')+
      '</div>'+
      '<div style="padding:2px 0 '+(isLast?'0':'16px')+'">'+
        '<div style="font-size:13px;font-weight:650;color:'+titleColor+'">'+nd.title+timeHtml+'</div>'+
        '<div style="font-size:12px;color:'+(nd.state==='next'?'#b0bac8':'#8492a6')+';margin-top:2px">'+nd.desc+'</div>'+
      '</div>'+
    '</div>';
  }).join('');
}

function regMarkInvalid(id){ var el=document.getElementById(id); if(el){ el.style.borderColor='#dc2626'; el.style.boxShadow='0 0 0 3px rgba(220,38,38,.12)'; } }
function regClearInvalid(el){ if(el){ el.style.borderColor='#d8e0ed'; el.style.boxShadow='none'; } var e=document.getElementById('regErr'); if(e){ e.style.display='none'; } }
function doRegister(){
  function v(id){ var el=document.getElementById(id); return el?el.value.trim():''; }
  var u=v('regUser').toLowerCase(), pw=v('regPwd'), name=v('regName'), phone=v('regPhone'),
      wechat=v('regWechat'), city=v('regCity'), org=v('regOrg'), dept=v('regDept'), title=v('regTitle');
  var fields=[['regUser',u,'登录账号名'],['regPwd',pw,'登录密码'],['regName',name,'姓名'],['regPhone',phone,'手机号码'],['regWechat',wechat,'微信号'],['regCity',city,'所在城市'],['regOrg',org,'所在单位'],['regDept',dept,'部门'],['regTitle',title,'职务']];
  var missing=fields.filter(function(f){return !f[1];});
  if(missing.length){
    missing.forEach(function(f){ regMarkInvalid(f[0]); });
    var first=document.getElementById(missing[0][0]);
    if(first){ first.focus(); first.scrollIntoView({behavior:'smooth',block:'center'}); }
    regErr('还有 '+missing.length+' 项未填：'+missing.map(function(f){return f[2];}).join('、'));
    if(typeof toast==='function') toast('请填写：'+missing.map(function(f){return f[2];}).join('、'));
    return;
  }
  if(!/^1[3-9]\d{9}$/.test(phone)){ regMarkInvalid('regPhone'); var pe=document.getElementById('regPhone'); if(pe){pe.focus();} regErr('手机号码格式不正确（应为11位手机号）'); if(typeof toast==='function') toast('手机号码格式不正确'); return; }
  if(ACCOUNTS[u]){ regErr('该账号为系统保留账号，请换一个'); return; }
  // 先从服务器拉最新用户库，避免覆盖别人
  var proceed=function(){
    if(USER_PROFILES[u]){ regErr('该账号已被注册'); return; }
    // 一个城市只能注册一个账号：同城市已有注册账号则拒绝
    var _dup=Object.keys(USER_PROFILES).filter(function(uk){return USER_PROFILES[uk]&&USER_PROFILES[uk].city===city;});
    if(_dup.length){ regErr('「'+city+'」已有账号注册（'+USER_PROFILES[_dup[0]].name+'），每个城市仅限一个账号，请直接登录'); return; }
    USER_PROFILES[u]={name:name,phone:phone,wechat:wechat,org:org,dept:dept,title:title,city:city,pwd:pw,ts:Date.now()};
    persist();
    AUTH={user:u, city:city, projKey:null, resident:false, who:name, org:org};
    saveAuth();
    cur=null; view='setup'; render._restored=false; render._routed=false;
    var done=false; var fb=setTimeout(function(){ if(!done){done=true;render();} },2000);
    restoreFromServer(function(){ if(!done){done=true;clearTimeout(fb);render();} });
    toast('✓ 注册成功，欢迎 '+name);
  };
  restoreFromServer(function(){ proceed(); });
  // 服务器无数据时 restoreFromServer 回调可能不触发，兜底
  setTimeout(function(){ if(!AUTH){ proceed(); } }, 1500);
}

function doLogin(){
  var u=(document.getElementById('loginUser')||{}).value||'';
  var pw=(document.getElementById('loginPwd')||{}).value||'';
  u=u.trim().toLowerCase();
  var _verify=function(){
    var acc=ACCOUNTS[u];
    // 内置账号不存在时，查注册用户库
    if(!acc && USER_PROFILES[u]){ var up=USER_PROFILES[u]; acc={pwd:up.pwd, city:up.city||null, projKey:null, resident:false, who:up.name||u, org:up.org||''}; }
    if(!acc){ loginErr('账号不存在'); return; }
    if(acc.pwd!==pw){ loginErr('密码错误'); return; }
    AUTH={user:u, city:acc.city, projKey:acc.projKey, resident:!!acc.resident, who:acc.who, org:acc.org};
    saveAuth();
    cur=null; view='setup'; render._restored=false; render._routed=false; render._serverSynced=false;
    render();
  };
  // 先从服务器拉取注册用户库再校验（登录门禁下 USER_PROFILES 尚未加载，否则真实账号会报「账号不存在」）
  var _done=false;
  var _fb=setTimeout(function(){ if(!_done){_done=true;_verify();} },2500);
  restoreFromServer(function(){ if(!_done){_done=true;clearTimeout(_fb);_verify();} });
}

/* onboarding 阶段上传文件的真实摄取：读取内容→切片→写入 KB_FILE_CHUNKS/UPLOADS */
function ingestSetupFiles(files, projKey){
  var p=PROJECTS[projKey]; if(!p) return;
  if(!KB_FILE_CHUNKS[projKey]) KB_FILE_CHUNKS[projKey]=[];
  if(!UPLOADS[projKey]) UPLOADS[projKey]=[];
  files.forEach(function(file){
    var isDocx=/\.docx?$/i.test(file.name);
    var canRead=/\.(txt|md|csv|json)$/i.test(file.name);
    if(isDocx && typeof mammoth!=='undefined'){
      var _e2={name:file.name,size:file.size,ts:Date.now(),chunks:0,kbIdx:null,pending:true};
      UPLOADS[projKey].push(_e2);persist();
      var _r2=new FileReader();
      _r2.onload=function(ev){
        mammoth.extractRawText({arrayBuffer:ev.target.result}).then(function(res){
          var cks=textToChunks(res.value||'',file.name,p,null);
          KB_FILE_CHUNKS[projKey]=KB_FILE_CHUNKS[projKey].concat(cks);
          _e2.chunks=cks.length;_e2.pending=false;persist();
          if(typeof render==='function')try{render();}catch(_){}
        }).catch(function(){_e2.pending=false;persist();});
      };
      _r2.readAsArrayBuffer(file);
    } else if(canRead){
      // 先同步登记 pending 条目：FileReader 异步，若等 onload 才入库，动画结束渲染侧栏时 UPLOADS 还是空 → 显示"0份材料"
      var entry={name:file.name, size:file.size, ts:Date.now(), chunks:0, kbIdx:null, pending:true};
      UPLOADS[projKey].push(entry);
      persist();
      var reader=new FileReader();
      reader.onload=function(e){
        var chunks=textToChunks(e.target.result||'', file.name, p, null);
        KB_FILE_CHUNKS[projKey]=KB_FILE_CHUNKS[projKey].concat(chunks);
        // 回填已登记的 pending 条目，避免重复计数
        entry.chunks=chunks.length; entry.pending=false;
        persist();
        if(typeof render==='function') try{ render(); }catch(_){}
        console.log('[setup-ingest] '+file.name+' → '+chunks.length+' chunks');
      };
      reader.readAsText(file,'utf-8');
    } else {
      KB_FILE_CHUNKS[projKey].push({
        id:'file:'+file.name+':0',
        topic:'上传材料', tags:['上传','材料'],
        text:'用户已上传文件「'+file.name+'」('+Math.round(file.size/1024)+'KB)，含与'+p.city+'招商研判相关材料。',
        cite:file.name});
      UPLOADS[projKey].push({name:file.name, size:file.size, ts:Date.now(), chunks:1, kbIdx:null});
      persist();
    }
  });
}

/* kb lock/readiness */
var KB_UNLOCKED={};

function kbReadiness(){
  var p=P(); if(!p||!p.kb) return {score:0,total:0,confirmed:0,files:0,label:'未开始',color:'#9aa5b5'};
  // 只统计 ⚠️ 条目作为「待确认」分母
  // 普通事实性条目（AI 从报告提取）默认已确认，不要求领导操作
  var warnTotal=0, warnConfirmed=0;
  p.kb.forEach(function(k,ki){
    (k.known||[]).forEach(function(x,xi){
      var isWarn=x.indexOf('\u26a0\ufe0f')>=0;
      var isDone=x.indexOf('\u2705')===0;
      if(!isWarn&&!isDone) return;  // 非⚠️且非✅，跳过
      warnTotal++;
      var conf=KB_CONFIRMS[cur]&&KB_CONFIRMS[cur][ki]&&KB_CONFIRMS[cur][ki][xi];
      if(conf||isDone) warnConfirmed++;
    });
  });
  // 同步纳入报告页「确认」（PENDING_CONFIRMS）的确认状态，
  // 否则报告页确认后顶部大进度条不动（两套确认系统互不相通的 bug 修复）
  var pend=PENDING_CONFIRMS[cur]||[];
  pend.forEach(function(it){
    warnTotal++;
    if(it&&(it.status==='confirmed'||it.status==='edited')) warnConfirmed++;
  });
  var uploads=(UPLOADS[cur]||[]).length;
  // 评分：⚠️确认率×60 + 上传加分×40
  var warnRate=warnTotal>0?warnConfirmed/warnTotal:1; // 无⚠️时视为全部完成
  var uploadBonus=Math.min(20, uploads*10); // 上传材料加分（可选）
  var score=Math.round(warnRate*80 + uploadBonus);
  var label=score>=80?'已就绪':score>=50?'基本完整':score>=20?'待补充':'未开始';
  var color=score>=80?'#22c55e':score>=50?'#f59e0b':score>=20?'#3b82f6':'#9aa5b5';
  return {score:score,total:warnTotal,confirmed:warnConfirmed,files:uploads,label:label,color:color};
}


/* 按研判方向计算置信度（基础分 + 话题数据加权） */
function topicScore(topic){
  var base = kbReadiness().score;
  // 各方向数据丰富度权重（基于随州实测数据覆盖情况）
  var weights = {
    '香菇': +8,   // 香菇：本地数据最全，产值/出口数据翔实
    '蘑菇': +8,
    '氢能': +5,   // 氢能：新楚风量产数据完整，但电堆缺口数据待补
    '専用车': +5,
    '应急': -3,   // 应急：感知层数据较薄，机器人/5G缺口依赖外部数据
    '安全': -3,
    '产业转移': -8,  // 产业转移：依赖沿海调研，本地数据少
    '承接': -8,
  };
  var adj = 0;
  if(topic){
    Object.keys(weights).forEach(function(k){
      if(topic.indexOf(k) >= 0) adj += weights[k];
    });
  }
  // 上传文件额外加分（每份+3，上限+15）
  var uploads = (UPLOADS[cur]||[]).filter(function(u){return !!u.size||!!u.ts;}).length;
  var uploadAdj = Math.min(15, uploads * 3);
  var final = Math.min(96, Math.max(42, base + adj + uploadAdj));
  return final;
}

function isLocked(v){
  if(['report','home','docking'].indexOf(v)<0) return false;
  if(!cur) return true;
  if(KB_UNLOCKED[cur]&&KB_UNLOCKED[cur][v]) return false;
  return kbReadiness().score<80;
}

function unlockView(v){
  if(!cur) return;

}

function bind(){
  document.addEventListener('click',function(e){
    var m=$('#swMenu');if(m&&m.style.display==='block'){var o=$('#orgName');if(o&&!o.contains(e.target)&&!m.contains(e.target))m.style.display='none'}
    var np=$('#notifPanel');if(np&&np.style.display==='block'&&!np.contains(e.target)&&!(e.target.closest&&e.target.closest('[onclick^=toggleNotif]'))){np.style.display='none'}
  });
  var ta=$('#composerTa');if(ta){ta.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}})}
}

function toggleClueGroup(projKey, seg){
  if(!window.__clueGroupOpen) window.__clueGroupOpen={};

  render();
}

/* ── 把 AI 扫描线索转为正式核验线索 ── */
function convertToClue(projKey, clueId){
  var p = PROJECTS[projKey]; if(!p) return;
  if(!p.clues) p.clues=[];
  // 在 ai_scan 池里找
  var sc = (p.clues||[]).find(function(c){return c.id===clueId;});
  if(sc){
    sc.status='amber'; // 核验中
    sc.tone='amber';
    p.stage=Math.max(p.stage,4);
    persist();
    render();
    toast('✓ 已发起资源核验，线索进入核验中状态');
  }
}

/* ── 暂不跟进 ── */
function dismissScanClue(projKey, clueId){
  var p = PROJECTS[projKey]; if(!p) return;
  p.clues=(p.clues||[]).filter(function(c){return c.id!==clueId;});
  persist(); render();
  toast('已移除该扫描线索');
}

/* ── 加载 AI 扫描结果到项目 ── */
function loadAIScanClues(projKey){
  var p = PROJECTS[projKey]; if(!p) return;
  if(!p.clues) p.clues=[];
  // 城市门禁：随州专项企业库仅限随州城市，其他城市不串随州数据
  if(!(p.city&&p.city.indexOf('随州')>=0)){ toast('该城市暂无 AI 实测企业库，请上传城市材料后由 AI 生成'); return; }

  // 根据项目 topic 匹配相关线索
  var topic=(p.topic||'').toLowerCase();
  var relevant=SUIZHOU_SCAN_CLUES.filter(function(sc){
    // 按缺口方向匹配
    if(topic.indexOf('氢能')>=0||topic.indexOf('电堆')>=0||topic.indexOf('储氢')>=0)
      return sc.gap.indexOf('电堆')>=0||sc.gap.indexOf('储氢')>=0;
    if(topic.indexOf('应急')>=0||topic.indexOf('机器人')>=0||topic.indexOf('无人机')>=0)
      return sc.gap.indexOf('机器人')>=0||sc.gap.indexOf('无人机')>=0;
    if(topic.indexOf('香菇')>=0||topic.indexOf('菌种')>=0||topic.indexOf('提取')>=0)
      return sc.gap.indexOf('多糖')>=0||sc.gap.indexOf('多肽')>=0||sc.gap.indexOf('菌种')>=0;
    // 默认：全部三大方向各取1条
    return sc.priority===5||sc.id.endsWith('001');
  });

  // 去重（已存在的不重复加）
  var existIds=(p.clues||[]).map(function(c){return c.id;});
  var newOnes=relevant.filter(function(sc){return existIds.indexOf(sc.id)<0;});
  p.clues=p.clues.concat(newOnes);
  persist();
  render();
  toast('✓ AI扫描完成，新增'+newOnes.length+'家候选企业（基于慧小招2026-07实测数据）');
}


function deriveCluesFromReport(projKey){
  var rs = REPORTSTATE[projKey];
  var p  = PROJECTS[projKey];
  if(!rs || !rs.text || !p) return;
  if(p.clues && p.clues.length > 0) return; // 已有线索不重复派生

  var text = rs.text;
  var lines = text.split('\n');
  var items = [];

  // 从 TOP5 / ❌缺失 行提取缺口
  var gaps = [];
  var inTop5 = false;
  for(var i=0; i<lines.length; i++){
    var l = lines[i];
    if(l.indexOf('补链优先级')>=0 || l.indexOf('TOP5')>=0 || l.indexOf('优先级清单')>=0) inTop5=true;
    if(inTop5 && l.trim().charAt(0)==='|'){
      var cells = l.trim().slice(1,-1).split('|').map(function(c){return c.replace(/[*★]/g,'').trim();});
      var isSep = cells.every(function(c){return /^[\s\-:]+$/.test(c);});
      if(isSep || cells[0]==='排名' || cells[0]==='缺口节点') continue;
      var rank = parseInt(cells[0]);
      if(!isNaN(rank) && rank>=1 && rank<=3 && cells[1]) gaps.push(cells[1]);
    }
    if(inTop5 && gaps.length>=3) break;
  }
  // 降级：找 ❌ 行
  if(!gaps.length){
    lines.forEach(function(l){
      if(l.indexOf('❌')>=0 && gaps.length<3){
        var c = l.replace(/^[*\-•|#\s]+/,'').replace(/❌|\*\*/g,'').trim();
        if(c.length>4 && c.length<50) gaps.push(c);
      }
    });
  }

  // 每个缺口生成一条脱敏候选线索
  var regionMap = ['长三角','华南','华东','华中'];
  var kindSuffix = ['系统集成商','制造企业','配套企业'];
  gaps.slice(0,3).forEach(function(gap, idx){
    items.push({
      id: 'clue_' + projKey + '_' + idx,
      name: '脱敏企业 ' + String.fromCharCode(65+idx) + '（' + gap.slice(0,8) + '·代号）',
      kind: gap + kindSuffix[idx%3],
      region: regionMap[idx%4],
      source: '慧小招研判报告（' + new Date().toLocaleDateString('zh-CN') + '）',
      status: '待资源核验',
      tone: 'slate',
      reason: '直接补「' + gap + '」缺口，与' + p.city + '本地链主形成配套需求。',
      signal: '基于报告缺口判断，具体企业投资意向与决策层触达可能性需资源团队核验。',
      questions: [
        '企业是否有异地布局或产能扩张计划',
        '与' + p.city + '本地链主的配套合作可行性',
        '落地规模与首批场景要求'
      ]
    });
  });

  if(!p.clues) p.clues = [];
  p.clues = p.clues.concat(items);
  persist();
}

/* ── 操作函数 ── */
function cleanCoName(n){
  if(!n) return n||'';
  // 去掉企业名后的（脱敏）/（代号：xxx）/(...) 等括号后缀，只保留企业名称
  return String(n).replace(/[\uff08(][^\uff09)]*[\uff09)]\s*$/,'').trim();
}
function toggleClue(id){
  window.__clueOpen = (window.__clueOpen===id) ? null : id;
  // 记录当前滚动容器位置：render() 整页重渲染会把 scrollTop 归零，导致展开卡片时视图弹回顶部
  var sc=document.querySelector('.report-scroll,.clues-scroll,.knowledge-scroll,.conversation-scroll,.docking-scroll');
  var top=sc?sc.scrollTop:0;
  render();
  // 重渲染后恢复滚动位置，让展开/折叠就地发生
  var restore=function(){
    var sc2=document.querySelector('.report-scroll,.clues-scroll,.knowledge-scroll,.conversation-scroll,.docking-scroll');
    if(sc2) sc2.scrollTop=top;
  };
  restore();
  // 再在下一帧恢复一次，防止浏览器异步重排把 scrollTop 又归零
  if(window.requestAnimationFrame) requestAnimationFrame(restore);
}

function requestVerify(projKey, clueId){
  var p = PROJECTS[projKey]; if(!p) return;
  var c = (p.clues||[]).find(function(x){return x.id===clueId;});

  c.tone = 'amber';

  persist();

  p.stage = Math.max(p.stage, 4);
  persist();
  render();
  toast('✓ 已发起资源核验，等待团队回传');
}

function arrangeDocking(projKey, clueId){

// 导出项目卡
function exportSub(){
  var subs=subprojOf(cur);var s=subs[curSub];if(!s){toast('项目不存在');return;}
  var p=P();var now=new Date().toLocaleString('zh-CN');var L=[];
  L.push('招引项目卡 · '+s.name.split(' · ')[0]);
  L.push('导出时间：'+now+'　|　编制：'+p.org+' · '+p.who);
  L.push('====================================================\n');
  L.push('招引方向：'+s.dir);
  L.push('来源产业方向：'+s.from);
  L.push('候选企业（脱敏）：'+(s.clueName||'暂无'));
  L.push('确认状态：干部确认 + 授权确认 已完成，已正式递交');
  L.push('当前阶段：'+STAGES[Math.min(s.stage||4,STAGES.length)-1][0]);
  L.push('');
  L.push('----------------------------------------------------');
  L.push('对接进度：需求已递交 → 资源匹配中 → 安排招商对接（待资源回传）');
  L.push('使用边界：脱敏展示，不显示内部人脉路径；对接由资源端线下推进，系统不自动联系企业。');
  var blob=new Blob([L.join('\n')],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='招引项目_'+s.name.split(' · ')[0]+'.txt';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  toast('已导出项目卡：'+s.name.split(' · ')[0]);
}

// 待保存的附件暂存（按项目）
var __dockFiles = {};
function dockFileSelected(projKey, inp){
  var files=Array.from(inp.files||[]);
  if(!files.length) return;
  if(!__dockFiles[projKey]) __dockFiles[projKey]=[];
  var pending=files.length;
  files.forEach(function(f){
    var reader=new FileReader();
    reader.onload=function(){
      __dockFiles[projKey].push({name:f.name, size:f.size, dataUrl:reader.result});
      pending--;
      if(pending===0) renderDockAttachDraft(projKey);
    };
    reader.readAsDataURL(f);
  });
  // 选材料附件时自动把类型切到"材料"
  setDockType(projKey,'material');
}
function renderDockAttachDraft(projKey){
  var box=document.getElementById('dock-attach-'+projKey);
  if(!box) return;
  var arr=__dockFiles[projKey]||[];
  if(!arr.length){ box.innerHTML=''; return; }
  box.innerHTML=arr.map(function(f,i){
    return '<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:8px;margin-bottom:6px">'+
      '<span style="font-size:13px">📎</span>'+
      '<span style="flex:1;min-width:0;font-size:12px;color:#4338ca;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+f.name+'</span>'+
      '<span style="font-size:11px;color:#9aa5b5">'+dockFileSize(f.size)+'</span>'+
      '<button onclick="removeDockDraftFile(\''+projKey+'\','+i+')" title="移除" style="background:none;border:none;color:#c0c8d4;font-size:14px;cursor:pointer;padding:0 2px">\u2715</button>'+
    '</div>';
  }).join('');
}
function removeDockDraftFile(projKey, idx){
  if(!__dockFiles[projKey]) return;
  __dockFiles[projKey].splice(idx,1);
  renderDockAttachDraft(projKey);
}
function dockFileSize(b){
  if(b==null) return '';
  if(b<1024) return b+'B';
  if(b<1048576) return (b/1024).toFixed(0)+'KB';
  return (b/1048576).toFixed(1)+'MB';
}
function dockDownloadAttach(projKey, ts, idx){
  var logs=DOCK_LOGS[projKey]||[];
  var l=logs.filter(function(x){return x.ts===ts;})[0];
  if(!l||!l.files||!l.files[idx]) return;
  var f=l.files[idx];
  var a=document.createElement('a');
  a.href=f.dataUrl; a.download=f.name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function saveDockLog(projKey){
  var ta=document.getElementById('dock-note-'+projKey);
  var files=__dockFiles[projKey]||[];
  var note=ta?ta.value.trim():'';
  if(!note && !files.length){toast('请填写对接记录内容或添加附件');return;}
  if(!DOCK_LOGS[projKey]) DOCK_LOGS[projKey]=[];
  DOCK_LOGS[projKey].unshift({
    ts: Date.now(),
    note: note||'（附件）',
    type: __dockType[projKey]||'visit',
    files: files.slice()
  });

// 触发生成报告
/* ══════════════════════════════════════════════════════════════
   产业分析 — 待确认事项结构化面板
   流程：进入页面自动触发草稿 → 解析⚠️ → 渲染确认面板 → 全部确认后解锁完整报告
   ══════════════════════════════════════════════════════════════ */

// 待确认事项状态 {projKey: [{text, status:'pending'|'confirmed'|'edited', editedText, files:[]}]}
var PENDING_CONFIRMS = PENDING_CONFIRMS || {};

/* 解析草稿文本，提取⚠️条目 */
function parsePendingItems(text){
  var items = [];
  var lines = text.split('\n');
  lines.forEach(function(line){
    var clean = line.replace(/^[\s\-•*]+/, '').trim();
    if(!clean) return;
    // 含⚠️的行
    if(clean.indexOf('⚠️') >= 0 || clean.indexOf('⚠') >= 0){
      var t = clean.replace('⚠️','').replace('⚠','').replace(/^[\s:：]+/,'').trim();
      if(t.length > 5) items.push({text: t, status:'pending', editedText:'', files:[]});
    }
  });
  return items;
}

var REPORT_HISTORY = REPORT_HISTORY || {};

function saveReportHistory(){try{localStorage.setItem('hxz_rpt_history',JSON.stringify(REPORT_HISTORY));}catch(e){}}

  var rs=REPORTSTATE[key];

  var exists=REPORT_HISTORY[key].some(function(h){return h.ts===rs.ts;});
  if(!exists){
    REPORT_HISTORY[key].unshift({text:rs.text,topic:rs.topic,ts:rs.ts,score:rs.score,phase:rs.phase});
    if(REPORT_HISTORY[key].length>10) REPORT_HISTORY[key]=REPORT_HISTORY[key].slice(0,10);

  }
}

function renderHistoryReports(key, topicFilter){
  var container=document.getElementById('reportHistoryArea');
  if(!container) return;
  var p=P();
  var currentTopic=topicFilter || (p?p.topic:'');
  var allReports=REPORT_HISTORY[key]||[];
  // 携带原始索引（删除/展开用），再按时间降序排序
  var list=allReports.map(function(rep,oi){return {rep:rep,oi:oi};});
  if(currentTopic) list=list.filter(function(x){return x.rep.topic===currentTopic;});
  list.sort(function(a,b){return (b.rep.ts||0)-(a.rep.ts||0);});
  if(!list.length){container.innerHTML='';return;}
  var h='<div style="margin-bottom:12px">';
  h+='<div style="font-size:11.5px;font-weight:700;color:#64748b;letter-spacing:.3px;margin-bottom:6px;display:flex;align-items:center;gap:6px">';
  h+='<span style="display:inline-block;width:3px;height:12px;background:#94a3b8;border-radius:2px"></span>';
  h+='历史报告（'+list.length+' 份）</div>';
  list.forEach(function(x,i){
    var rep=x.rep; var oi=x.oi;
    var dt=rep.ts?new Date(rep.ts).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'未知时间';
    var phaseLabel=rep.phase===2?'完整报告':'初步草稿';
    var phaseColor=rep.phase===2?'#1d4ed8':'#92400e';
    var phaseBg=rep.phase===2?'#dbeafe':'#fef3c7';
    h+='<div style="border-radius:12px;border:1.5px solid #e2e8f0;overflow:hidden;margin-bottom:6px;background:#fff">';
    // 折叠头
    h+='<div style="padding:10px 14px;background:#f8faff;display:flex;align-items:center;gap:8px;cursor:pointer" onclick="toggleHistoryReport(\''+key+'\','+i+')">';
    h+='<span id="hrpt-ico-'+key+'-'+i+'" style="font-size:10px;color:#94a3b8;flex-shrink:0">▶</span>';
    h+='<span style="font-size:11px;padding:1px 7px;border-radius:10px;background:'+phaseBg+';color:'+phaseColor+';font-weight:700">'+phaseLabel+'</span>';
    h+='<span style="font-size:12px;font-weight:600;color:#374151;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+rep.topic+'</span>';
    h+='<span style="font-size:11px;color:#94a3b8;flex-shrink:0">'+dt+'</span>';
    if(rep.score!=null) h+='<span style="font-size:11px;color:#64748b;flex-shrink:0;margin-left:4px">'+rep.score+'%</span>';
    h+='<button onclick="event.stopPropagation();deleteHistoryReport(\''+key+'\','+i+')" style="flex-shrink:0;margin-left:6px;padding:2px 8px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;font-size:11px;color:#ef4444;cursor:pointer;font-weight:600">删除</button>';
    h+='</div>';
    // 折叠体（默认收起）
    h+='<div id="hrpt-body-'+key+'-'+i+'" style="display:none;padding:14px 16px;font-size:12.5px;color:#1e293b;line-height:1.8;border-top:1px solid #f0f4ff;max-height:400px;overflow-y:auto">';
    // 简单 markdown 渲染
    var txt=rep.text||'';
    txt=txt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    txt=txt.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
    txt=txt.replace(/^#{1,3}\s(.+)$/gm,'<div style="font-weight:700;color:#0b183b;margin:8px 0 3px">$1</div>');
    txt=txt.replace(/^[-•]\s(.+)$/gm,'<div style="padding-left:12px;margin:2px 0">· $1</div>');
    txt=txt.replace(/\n\n/g,'<br>');
    h+=txt;
    h+='</div>';
    h+='</div>';
  });
  h+='</div>';
  container.innerHTML=h;
}

/* 折叠/展开待确认事项面板 */
function toggleConfirmPanel(projKey){
  if(window.__cpCollapsed==null) window.__cpCollapsed={};
  window.__cpCollapsed[projKey]=!window.__cpCollapsed[projKey];
  var body=document.getElementById('cp-body-'+projKey);
  var caret=document.getElementById('cp-caret-'+projKey);
  var collapsed=window.__cpCollapsed[projKey];
  if(body) body.style.display=collapsed?'none':'block';
  if(caret) caret.style.transform='rotate('+(collapsed?'0':'180')+'deg)';
}

/* 更新进度条和解锁状态 */
function updateConfirmProgress(projKey){
  var items=PENDING_CONFIRMS[projKey]||[];
  var total=items.length;
  var done=items.filter(function(x){return x.status==='confirmed'||x.status==='edited';}).length;
  var allDone=done===total&&total>0;
  var prog=document.getElementById('cp-progress-'+projKey);
  if(prog) prog.textContent=done+' / '+total+' 已确认';
  var bar=document.getElementById('cp-bar-'+projKey);
  if(bar) bar.style.width=(total?Math.round(done/total*100):0)+'%';
  var unlock=document.getElementById('cp-unlock-'+projKey);
  if(unlock){
    unlock.style.background=allDone?'#f0fdf4':'#f9fafb';
    unlock.style.borderColor=allDone?'#86efac':'#e8edf5';
    unlock.innerHTML=allDone
      ?'<span style="font-size:13px;font-weight:650;color:#166534">✓ 所有事项已确认，可生成完整产业报告</span>'
      :'<span style="font-size:13px;color:#9aa5b5">还剩 '+(total-done)+' 条待确认</span>';
  }
  // 始终强制重建底部操作栏
  var bottomBar=document.querySelector('.report-bottom-bar');
  if(!bottomBar) return persist();
  // 全部确认后推进到「资源匹配」阶段
  var _p=P(); if(_p && allDone && _p.stage<4){ _p.stage=4; }
  if(_p && !allDone && _p.stage===4){ _p.stage=3; }
  if(allDone){
    bottomBar.innerHTML=
      '<div style="flex:1;font-size:12.5px;color:#166534;background:#f0fdf4;padding:10px 14px;border-radius:10px;border:1px solid #86efac">✓ 所有待确认事项已完成</div>'+
      '<button onclick="triggerReport(2)" style="padding:12px 24px;background:linear-gradient(135deg,#1a56db,#6366f1);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:650;cursor:pointer;box-shadow:0 4px 16px rgba(26,86,219,.3)">生成完整产业报告 →</button>'+
      '<button onclick="doUpload()" style="padding:12px 14px;background:#f5f7fb;border:1.5px solid #e8edf5;border-radius:12px;font-size:13px;color:#4a5568;cursor:pointer">📎 补充材料</button>';
  } else {
    bottomBar.innerHTML=
      '<div style="flex:1;font-size:12.5px;color:#92400e;background:#fffbeb;padding:10px 14px;border-radius:10px;border:1px solid #fde68a">请确认上方 '+(total-done)+' 条待确认事项后生成完整产业报告</div>'+
      '<button disabled style="padding:12px 20px;background:#e8edf5;color:#9aa5b5;border:none;border-radius:12px;font-size:13.5px;cursor:not-allowed">完成确认后解锁 →</button>'+
      '<button onclick="doUpload()" style="padding:12px 14px;background:#f5f7fb;border:1.5px solid #e8edf5;border-radius:12px;font-size:13px;color:#4a5568;cursor:pointer">📎 补充材料</button>';
  }
  persist();
}

/* 确认一条 */
function cfmItem(projKey, idx){
  if(!PENDING_CONFIRMS[projKey]) return;
  PENDING_CONFIRMS[projKey][idx].status = 'confirmed';
  var card = document.getElementById('ci-'+projKey+'-'+idx);
  if(card){
    var item = PENDING_CONFIRMS[projKey][idx];
    var displayText = item.editedText || item.text;
    var filesBadge = item.files&&item.files.length?'<span style="margin-left:6px;padding:1px 7px;background:#f0fdf4;color:#166534;border-radius:10px;font-size:10.5px;border:1px solid #86efac">'+item.files.length+' 个附件</span>':'';
    card.style.cssText='display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:#f0fdf4;border:1.5px solid #86efac;border-radius:12px';
    card.innerHTML=
      '<span style="color:#22c55e;font-size:16px;flex-shrink:0;margin-top:1px">✓</span>'+
      '<div style="flex:1;min-width:0"><div style="font-size:13px;color:#14532d;line-height:1.65">'+displayText+filesBadge+'</div>'+
      '<div style="font-size:11px;color:#22c55e;margin-top:3px">已确认</div></div>'+
      '<button onclick="uncfmItem(\''+projKey+'\','+idx+')" style="padding:3px 8px;background:none;border:1px solid #86efac;border-radius:6px;font-size:11px;color:#22c55e;cursor:pointer;flex-shrink:0">撤回</button>';
  }
  persist(); // 同步确认状态到服务器
  updateConfirmProgress(projKey);
  refreshTopReliability();
}

/* 撤回确认 */
function uncfmItem(projKey, idx){
  if(!PENDING_CONFIRMS[projKey]) return;
  PENDING_CONFIRMS[projKey][idx].status = 'pending';
  // 重新渲染整个面板
  var panel = document.getElementById('confirmPanel-'+projKey);
  if(panel){
    var tmp = document.createElement('div');
    tmp.innerHTML = renderConfirmPanel(PENDING_CONFIRMS[projKey], projKey);
    panel.replaceWith(tmp.firstChild);
  }
  persist(); // 同步撤回到服务器
  updateConfirmProgress(projKey);
  refreshTopReliability();
}

/* 确认/撤回后即时刷新顶部大进度条（侧栏完成度条 + 招商问答页顶部横幅） */
function refreshTopReliability(){
  try{ refreshKbProgress(); }catch(e){}
  // 招商问答页(kbPage)顶部横幅：若当前正显示该页，重渲染以更新百分比/文案
  try{
    if(view==='knowledge'&&typeof render==='function'){ render(); }
  }catch(e){}
  try{ persist(); }catch(e){}
}

function ciShowEdit(projKey, idx){
  var edit = document.getElementById('ci-edit-'+projKey+'-'+idx);
  var ta   = document.getElementById('ci-ta-'+projKey+'-'+idx);

function ciCancelEdit(projKey, idx){

/* 保存修改 */
function ciSave(projKey, idx){

  var card = document.getElementById('ci-'+projKey+'-'+idx);
  if(card){
    var displayText = item.editedText;

    card.style.cssText='display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:#f0fdf4;border:1.5px solid #86efac;border-radius:12px';
    card.innerHTML=
      '<span style="color:#22c55e;font-size:16px;flex-shrink:0;margin-top:1px">✓</span>'+
      '<div style="flex:1;min-width:0"><div style="font-size:13px;color:#14532d;line-height:1.65">'+displayText+filesBadge+'</div>'+
      '<div style="font-size:11px;color:#22c55e;margin-top:3px">已修改并确认</div></div>'+
      '<button onclick="uncfmItem(\''+projKey+'\','+idx+')" style="padding:3px 8px;background:none;border:1px solid #86efac;border-radius:6px;font-size:11px;color:#22c55e;cursor:pointer;flex-shrink:0">撤回</button>';
  }
  updateConfirmProgress(projKey);

/* 附件相关 */
function ciPickFile(projKey, idx){
  var inp = document.getElementById('ci-finp-'+projKey+'-'+idx);
  if(inp) inp.click();
}
function ciDropFile(e, projKey, idx){
  e.preventDefault();
  var files = Array.from(e.dataTransfer&&e.dataTransfer.files||[]);
  if(files.length) ciAttachFiles(files, projKey, idx);
}
function ciFileSelected(inp, projKey, idx){
  var files = Array.from(inp&&inp.files||[]);
  if(files.length) ciAttachFiles(files, projKey, idx);
}
function ciAttachFiles(files, projKey, idx){
  var item = PENDING_CONFIRMS[projKey] && PENDING_CONFIRMS[projKey][idx];
  if(!item) return;
  if(!item.files) item.files = [];
  files.forEach(function(f){ item.files.push({name:f.name, size:f.size, ts:Date.now()}); });
  ingestFiles(files, null);  // 加入城市智库 corpus
  var hint = document.getElementById('ci-file-hint-'+projKey+'-'+idx);
  if(hint) hint.innerHTML = '✅ 已上传 '+item.files.length+' 个附件：'+item.files.map(function(f){return f.name;}).join('、');
  persist();
  toast('📎 已上传 '+files.length+' 个附件并加入知识库');
}


/* 立项卡片 */
/* 恢复确认面板（如果有待确认事项） */
function restoreConfirmPanel(){
  // 若当前方向待确认事项为空，按方向缓存/报告文本恢复
  if(cur && REPORTSTATE[cur] && (!PENDING_CONFIRMS[cur] || !PENDING_CONFIRMS[cur].length)){
    var _p=P(); var _topic=_p?_p.topic:'';
    var _pb=REPORTSTATE[cur].pendingByTopic||{};
    var _np=_topic?_pb[_topic]:null;
    if((!_np||!_np.length)&&_topic){
      var _rtxt=getTopicReport(_topic)||REPORTSTATE[cur].text||'';
      _np=parsePendingItems(_rtxt);
    }
    if(_np&&_np.length){
      PENDING_CONFIRMS[cur]=_np;
      if(!REPORTSTATE[cur].pendingByTopic) REPORTSTATE[cur].pendingByTopic={};
      if(_topic) REPORTSTATE[cur].pendingByTopic[_topic]=_np;
    }
  }
  if(!cur || !PENDING_CONFIRMS[cur] || !PENDING_CONFIRMS[cur].length) return '';
  var reanalyzeBtn = '<div style="margin-bottom:12px;display:flex;gap:10px;align-items:center">'+
    '<button onclick="startAiInterview()" style="padding:10px 20px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:650;cursor:pointer"> 重新分析（AI访谈）</button>'+
    '<span style="font-size:12px;color:#8492a6">重新选择方向并通过AI访谈补充信息后生成新报告</span>'+
  '</div>';
  return reanalyzeBtn + renderConfirmPanel(PENDING_CONFIRMS[cur], cur);
}

/* 从REPORTSTATE恢复已保存的招引方向卡片 */
function restoreActionItems(){
  if(!cur || !REPORTSTATE[cur]) return '';
  var p=P();

/* 从报告文本解析TOP3招引方向（供渲染与切换方向时复用） */
function parseActionItems(text){
  var items=[];
  if(!text) return items;
  var tlines=text.split('\n');
  var inTop5=false;
  for(var i=0;i<tlines.length;i++){
    var l=tlines[i];
    if(l.indexOf('补链优先级')>=0||l.indexOf('TOP5')>=0||l.indexOf('优先级清单')>=0||l.indexOf('承接优先方向')>=0||l.indexOf('补链优先级TOP3')>=0) inTop5=true;
    if(inTop5&&l.trim().charAt(0)==='|'){
      var cells=l.trim().slice(1,-1).split('|').map(function(c){return c.replace(/[*\u2605<>]/g,'').trim();});
      if(cells.length>=2){
        var isSep=cells.every(function(c){return /^[\s\-:]+$/.test(c);});
        if(isSep||cells[0]==='排名'||cells[0]==='缺口节点'||cells[0]==='缺口'||cells[0]==='方向') continue;
        var rank=parseInt(cells[0]);
        if(!isNaN(rank)&&rank>=1&&rank<=3&&cells[1]){
          items.push({rank:rank,gap:cells[1],attr:cells[2]||'',score:cells[cells.length-1]||''});
        }
      }
    }
    if(inTop5&&items.length>=3) break;
  }
  if(!items.length){
    tlines.forEach(function(l){
      if((l.indexOf('\u274c')>=0||l.indexOf('缺失')>=0||l.indexOf('全部外购')>=0)&&items.length<3){
        var clean=l.replace(/^[*\-\u2022|#\s]+/,'').replace(/\u274c|\*\*/g,'').trim();
        if(clean.length>4&&clean.length<60) items.push({rank:items.length+1,gap:clean,attr:'',score:''});
      }
    });
  }
  return items;
}

/* 提交招商需求 */
function importToProject(gap, city, topic, btnEl){
  var key='proj_'+Date.now().toString(36);
  var p=P();
  PROJECTS[key]={
    id:key, city:city||p.city, org:(city||p.city)+'市招商局', who:p?p.who:'负责人',
    topic:gap, stage:3,  // 立项即跳过研判，直接到「确认需求」
    kb: p ? JSON.parse(JSON.stringify(p.kb)) : [],
    report: REPORTSTATE[cur] ? {
      title:(city||p.city)+'·'+gap+'招商研判报告',
      lead:gap+'方向招引，基于慧小招实测报告',
      sections:[{h:'研判依据',p:(REPORTSTATE[cur].text||'').substring(0,300)+'…',type:'real',ev:'慧小招研判报告',chk:''}],
      summary:[['数据来源','慧小招实测'],['置信度',topicScore(P()&&P().topic)+'%'],['生成时间',new Date().toLocaleDateString('zh-CN')]]
    } : null,
    clues:[]
  };
  // 把父项目的报告复制给新项目（让产业分析页可以直接使用）
  if(cur && REPORTSTATE[cur] && !REPORTSTATE[key]){
    REPORTSTATE[key]=JSON.parse(JSON.stringify(REPORTSTATE[cur]));
    REPORTSTATE[key].topic=gap;   // 更新 topic 为新方向
    REPORTSTATE[key].phase=2;     // 保留完整报告（研判已完成）
  }
  // 同步到管理端需求池（DEMANDS）
  if(typeof DEMANDS==='undefined') window.DEMANDS=[];
  DEMANDS.push({
    id:key,
    city:city||p.city,
    topic:gap,
    from:topic||p.topic,
    who:p?p.who:'负责人',
    org:(city||p.city)+'市招商局',
    ts:Date.now(),
    status:'pending'
  });
  // 不切换 cur — 保留当前研判页所有状态
  persist();
  // 更新按钮为「已提交·可撤回」状态
  if(btnEl){
    btnEl.textContent='↩ 撤回提交';
    btnEl.style.background='#fff';
    btnEl.style.color='#dc2626';
    btnEl.style.border='1.5px solid #fca5a5';
    btnEl.style.cursor='pointer';
    btnEl.setAttribute('data-projkey', key);
    btnEl.onclick=function(){ withdrawDemand(key, btnEl, gap, city, topic, color); };
  }
  toast('✓ 已提交招商需求（可撤回）');
}

/* 撤回招商需求：删除生成的项目 + 需求池记录，同步到管理端 */
function withdrawDemand(key, btnEl, gap, city, topic, color){
  // 删除项目及其派生数据
  if(PROJECTS[key]) delete PROJECTS[key];
  if(REPORTSTATE[key]) delete REPORTSTATE[key];
  if(typeof DOCK_LOGS!=='undefined' && DOCK_LOGS[key]) delete DOCK_LOGS[key];
  if(typeof PENDING_CONFIRMS!=='undefined' && PENDING_CONFIRMS[key]) delete PENDING_CONFIRMS[key];
  if(typeof UPLOADS!=='undefined' && UPLOADS[key]) delete UPLOADS[key];
  // 删除需求池记录（importToProject 用 id===key）
  if(typeof DEMANDS!=='undefined'){
    for(var i=DEMANDS.length-1;i>=0;i--){ if(DEMANDS[i].id===key || DEMANDS[i].projKey===key) DEMANDS.splice(i,1); }
  }
  // 若当前正停留在被撤回的项目上，回退 cur
  if(cur===key) cur=null;
  persist();   // 同步到 /api/sync，管理端自动移除
  // 恢复按钮为「提交招商需求」
  if(btnEl){
    btnEl.textContent='提交招商需求 →';
    btnEl.style.background=color||'#1a56db';
    btnEl.style.color='#fff';
    btnEl.style.border='none';
    btnEl.style.cursor='pointer';
    btnEl.removeAttribute('data-projkey');
    btnEl.onclick=function(){ importToProject(gap, city, topic, btnEl); };
  }
  toast('已撤回，管理端项目同步移除');
}

function interviewNext(){
  var textarea=document.getElementById('interviewAnswer');
  var text=(textarea?textarea.value:'').trim();
  if(!text){
    toast('请先作答，或点击「跳过」');
    if(textarea){ textarea.focus(); textarea.style.border='1.5px solid #f59e0b'; }
    return;
  }
  _interviewState.answers[_interviewState.currentQ]={text:text, id:_interviewState.questions[_interviewState.currentQ].id};
  _interviewState.currentQ++;
  renderInterviewUI();
}

function interviewSkip(){
  _interviewState.answers[_interviewState.currentQ]={text:'', id:_interviewState.questions[_interviewState.currentQ].id, skipped:true};
  _interviewState.currentQ++;
  if(_interviewState.currentQ>=_interviewState.questions.length){
    interviewDone();
  } else {
    renderInterviewUI();
  }
}

function interviewPrev(){
  var textarea=document.getElementById('interviewAnswer');
  var text=(textarea?textarea.value:'').trim();
  _interviewState.answers[_interviewState.currentQ]={text:text, id:_interviewState.questions[_interviewState.currentQ].id};
  _interviewState.currentQ--;
  renderInterviewUI();
}

function interviewDone(){
  // Save last answer
  var textarea=document.getElementById('interviewAnswer');
  if(textarea){
    var text=textarea.value.trim();
    _interviewState.answers[_interviewState.currentQ]={text:text, id:_interviewState.questions[_interviewState.currentQ].id};
  }
  // Collect all non-empty answers into context for the analysis
  var context=_interviewState.answers.filter(function(a){return a&&a.text;}).map(function(a){
    var qObj=_interviewState.questions.find(function(q){return q.id===a.id;});
    return '【'+qObj.q.substring(0,20)+'…】'+a.text;
  }).join('\n');
  // Store interview context for use in triggerReport
  window._interviewContext=context;
  // Now trigger the actual analysis
  triggerReport(1);
}

          '<span id="anaIco'+i+'" style="flex-shrink:0;width:20px;height:20px;border-radius:50%;border:2px solid #cbd5e1;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#94a3b8">'+(i+1)+'</span>'+

    '</div>';

    function runStep(){
      if(si>0)finishStep(si-1);

      else {
        var bar=document.getElementById('anaBar'); if(bar)bar.style.width='100%';

    setTimeout(runStep, 300);
  }
  function renderMd(md){
    md=md.replace(/\n{3,}/g,'\n\n');
    md=md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    md=md.replace(/\*\*([^*\n]+)\*\*/g,'<strong style="color:#0b183b">$1</strong>');
    md=md.replace(/`([^`]+)`/g,'<code style="background:#f0f4ff;color:#1a56db;padding:1px 5px;border-radius:4px;font-size:11.5px">$1</code>');
    md=md.replace(/⚠️/g,'<span style="color:#d97706;font-weight:600">⚠️</span>');
    md=md.replace(/✅/g,'<span style="color:#16a34a">✅</span>');
    md=md.replace(/❌/g,'<span style="color:#dc2626">❌</span>');
    md=md.replace(/★+/g,function(m){return '<span style="color:#f59e0b;letter-spacing:1px">'+m+'</span>';});
    md=md.replace(/A[=]必须本地化/g,'<span style="padding:1px 6px;background:#fee2e2;color:#991b1b;border-radius:4px;font-size:11px;font-weight:600">A 必须本地化</span>');
    md=md.replace(/B[=]可跨区域/g,'<span style="padding:1px 6px;background:#dbeafe;color:#1e3a8a;border-radius:4px;font-size:11px;font-weight:600">B 可跨区域</span>');
    md=md.replace(/C[=]优先本地化/g,'<span style="padding:1px 6px;background:#d1fae5;color:#064e3b;border-radius:4px;font-size:11px;font-weight:600">C 优先本地化</span>');
    // 章节标题：## 一、格式 和 纯 一、格式，统一渲染，防止双重
    md=md.replace(/^#{0,3}\s*([一二三四五六七八九十]+)[、]\s*(.+)$/gm,function(m,num,title){
      return '<div style="display:flex;align-items:center;gap:10px;margin:20px 0 8px;padding-bottom:7px;border-bottom:2px solid #1a56db">'+
        '<span style="display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;background:#1a56db;color:#fff;border-radius:50%;font-size:12px;font-weight:700;flex-shrink:0">'+num+'</span>'+
        '<span style="font-size:14px;font-weight:750;color:#0b183b">'+title+'</span>'+
      '</div>';
    });
    md=md.replace(/^###\s(.+)$/gm,'<div style="font-size:13px;font-weight:700;color:#4a5568;margin:10px 0 4px;padding-left:10px;border-left:3px solid #6366f1">$1</div>');
    md=md.replace(/^##\s(.+)$/gm,'<div style="font-size:13.5px;font-weight:750;color:#0b183b;margin:12px 0 6px;padding:5px 12px;background:#f8faff;border-radius:8px;border-left:4px solid #1a56db">$1</div>');
    md=md.replace(/^#\s(.+)$/gm,'<div style="font-size:15px;font-weight:800;color:#0b183b;margin:14px 0 8px">$1</div>');
    // 表格逐行解析（正确跳过分隔行）
    var outLines=[]; var inTbl=false;
    var mdLines=md.split('\n');
    for(var li=0;li<mdLines.length;li++){
      var line=mdLines[li];
      var tr=line.trim();
      if(tr.charAt(0)==='|'&&tr.charAt(tr.length-1)==='|'){
        var isSep=tr.slice(1,-1).split('|').every(function(c){return /^[\s\-:]+$/.test(c);});
        if(isSep) continue;
        var cells=tr.slice(1,-1).split('|').map(function(c){return c.trim();});
        if(!inTbl){
          inTbl=true;
          outLines.push('<div style="overflow-x:auto;margin:10px 0"><table style="width:100%;border-collapse:collapse;font-size:12.5px">');
          outLines.push('<thead><tr>'+cells.map(function(c){
            return '<th style="padding:8px 12px;background:#f0f4ff;border:1px solid #dbeafe;font-weight:700;color:#1e3a8a;text-align:left;white-space:nowrap">'+c+'</th>';
          }).join('')+'</tr></thead><tbody>');
        } else {
          outLines.push('<tr>'+cells.map(function(c,ci){
            return '<td style="padding:8px 12px;border:1px solid #e8edf5;color:#1e293b;vertical-align:top;background:'+(ci===0?'#fafbff':'#fff')+'">'+c+'</td>';
          }).join('')+'</tr>');
        }
      } else {
        if(inTbl){outLines.push('</tbody></table></div>');inTbl=false;}
        outLines.push(line);
      }
    }
    if(inTbl)outLines.push('</tbody></table></div>');
    md=outLines.join('\n');
    // 列表
    md=md.replace(/^[-•]\s(.+)$/gm,'<li style="margin:4px 0;color:#1e293b">$1</li>');
    md=md.replace(/^\d+\.\s(.+)$/gm,'<li style="margin:4px 0;color:#1e293b">$1</li>');
    // 段落：空行分隔，block 元素不再包裹
    var parts=md.split('\n\n');
    md=parts.map(function(chunk){
      var c=chunk.trim();
      if(!c) return '';
      if(/^<(div|table|ul|ol|li|thead|tbody|tr)/.test(c)) return c;
      return '<p style="margin:5px 0;line-height:1.85;color:#1e293b">'+c.replace(/\n/g,'<br>')+'</p>';
    }).filter(Boolean).join('\n');
    return md;
  }
  fetch('/api/kb-chat',{
    method:'POST',headers:{'Content-Type':'application/json'},

    var reader=resp.body.getReader(); var decoder=new TextDecoder(); var buf='';
    function pump(){

              return '<span style="padding:1px 6px;background:#f0f4ff;color:#1a56db;border-radius:4px;font-size:10.5px">'+c+'</span>';
            }).join(' ')+' · DeepSeek · '+elapsed+'ms · 置信度 '+topicScore(p.topic)+'%';
            footer.style.display='block';
          }
          var bottomBar=document.querySelector('.report-bottom-bar');
          if(bottomBar){
            if(phase===1){
              // 解析⚠️ → 渲染确认面板
              var pendingItems=parsePendingItems(accText);
              if(pendingItems.length>0){
                if(!PENDING_CONFIRMS[cur]) PENDING_CONFIRMS[cur]=[];
                // 保留已有确认状态，追加新条目
                var existTexts=PENDING_CONFIRMS[cur].map(function(x){return x.text;});
                pendingItems.forEach(function(it){
                  if(existTexts.indexOf(it.text)<0) PENDING_CONFIRMS[cur].push(it);
                });
                persist();
                // 把确认面板插到报告区下方（避免重复）
                var reportArea=document.getElementById('reportArea');
                if(reportArea && !document.getElementById('confirmPanel-'+cur)){
                  var panelHtml=renderConfirmPanel(PENDING_CONFIRMS[cur],cur);
                  var panelDiv=document.createElement('div');
                  panelDiv.innerHTML=panelHtml;
                  reportArea.appendChild(panelDiv.firstChild);
                }
              }
              // 底部：根据是否有待确认项决定按钮状态
              var hasPending=PENDING_CONFIRMS[cur]&&PENDING_CONFIRMS[cur].length>0;
              var allDone=hasPending&&PENDING_CONFIRMS[cur].every(function(x){return x.status==='confirmed'||x.status==='edited';});
              bottomBar.innerHTML=
                '<div style="flex:1;font-size:12.5px;color:#92400e;background:#fffbeb;padding:10px 14px;border-radius:10px;border:1px solid #fde68a;line-height:1.6">'+
                  (hasPending&&!allDone?'请确认上方待确认事项后，才可生成完整产业报告':'以上为初步研判草稿，确认方向后生成完整五章报告')+

// 提交招引需求到管理端需求池
function submitDemand(){
  var p=P(); if(!p) return;
  var rs=REPORTSTATE[cur];
  if(!rs){toast('请先生成研判报告'); return;}
  // 检查是否已提交
  var existing=DEMANDS.find(function(d){return d.projKey===cur;});
  if(existing){toast('该方向已提交需求池'); return;}
  DEMANDS.push({
    id:'d'+Date.now().toString(36),
    projKey:cur,
    city:p.city, gov:p.org+'·'+p.who,
    topic:p.topic, domain:p.topic.replace('补链','').replace('升级',''),
    need:'基于研判报告（置信度'+topicScore(P()&&P().topic)+'%），见报告全文',
    submit:'刚刚', res:'none', resLabel:'待研判', clues:0,
    note:rs.text?rs.text.slice(0,120)+'…':'', ai:''
  });
  p.stage=Math.max(p.stage,3);
  // 提交即写入阶段留痕（时间线起点），供前台"递交时间线"动态展示
  if(!p.stageLog) p.stageLog=[];
  if(!p.stageLog.length || p.stageLog[0].note!=='招商需求已正式递交'){
    p.stageLog.unshift({ts:Date.now(), from:2, to:3, note:'招商需求已正式递交', who:'政府端'});
  }
  // 立即派生线索（如果有报告）
  deriveCluesFromReport(cur);
  persist();
  toast('✓ 招引需求已提交，候选线索已自动派生');
}

function reportHtml(p){
  var rs=REPORTSTATE[cur]; if(!rs) return '';
  var r=kbReadiness();
  function renderMd(md){
    md=md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    md=md.replace(/\*\*([^*\n]+)\*\*/g,'<strong style="color:#0b183b">$1</strong>');
    md=md.replace(/⚠️/g,'<span style="color:#d97706;font-weight:600">⚠️</span>');
    md=md.replace(/✅/g,'<span style="color:#16a34a">✅</span>');
    md=md.replace(/❌/g,'<span style="color:#dc2626">❌</span>');
    md=md.replace(/★+/g,function(m){return '<span style="color:#f59e0b">'+m+'</span>';});
    md=md.replace(/^#{0,3}\s*([一二三四五六七八九十]+)[、]\s*(.+)$/gm,
      '<div style="display:flex;align-items:center;gap:10px;margin:18px 0 8px;padding-bottom:6px;border-bottom:2px solid #1a56db">'+
        '<span style="display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;background:#1a56db;color:#fff;border-radius:50%;font-size:12px;font-weight:700">$1</span>'+
        '<span style="font-size:14px;font-weight:750;color:#0b183b">$2</span></div>');
    md=md.replace(/^###\s(.+)$/gm,'<div style="font-size:13px;font-weight:700;color:#4a5568;margin:10px 0 4px;padding-left:10px;border-left:3px solid #6366f1">$1</div>');
    md=md.replace(/^##\s(.+)$/gm,'<div style="font-size:13.5px;font-weight:750;color:#0b183b;margin:12px 0 6px;padding:5px 12px;background:#f8faff;border-radius:8px;border-left:4px solid #1a56db">$1</div>');
    // 表格
    var outLines=[]; var inTbl=false;
    md.split('\n').forEach(function(line){
      var tr=line.trim();
      if(tr.charAt(0)==='|'&&tr.charAt(tr.length-1)==='|'){
        if(tr.slice(1,-1).split('|').every(function(c){return /^[\s\-:]+$/.test(c);})) return;
        var cells=tr.slice(1,-1).split('|').map(function(c){return c.trim();});
        if(!inTbl){inTbl=true;outLines.push('<div style="overflow-x:auto;margin:10px 0"><table style="width:100%;border-collapse:collapse;font-size:12.5px">');
          outLines.push('<thead><tr>'+cells.map(function(c){return '<th style="padding:7px 10px;background:#f0f4ff;border:1px solid #dbeafe;font-weight:700;color:#1e3a8a;text-align:left">'+c+'</th>';}).join('')+'</tr></thead><tbody>');}
        else outLines.push('<tr>'+cells.map(function(c,ci){return '<td style="padding:7px 10px;border:1px solid #e8edf5;color:#1e293b;background:'+(ci===0?'#fafbff':'#fff')+'">'+c+'</td>';}).join('')+'</tr>');
      } else {if(inTbl){outLines.push('</tbody></table></div>');inTbl=false;} outLines.push(line);}
    });
    if(inTbl)outLines.push('</tbody></table></div>');
    md=outLines.join('\n');
    md=md.replace(/^[-•]\s(.+)$/gm,'<li style="margin:4px 0;color:#1e293b">$1</li>');
    var parts=md.split('\n\n');
    md=parts.map(function(chunk){var c=chunk.trim();if(!c)return '';if(/^<(div|table|ul)/.test(c))return c;return '<p style="margin:5px 0;line-height:1.85;color:#1e293b">'+c.replace(/\n/g,'<br>')+'</p>';}).filter(Boolean).join('\n');
    return md;
  }
  return '<div style="border-radius:14px;border:1.5px solid #e8edf5;overflow:hidden;margin-bottom:8px">'+
    '<div style="padding:12px 16px;background:#f8faff;border-bottom:1px solid #e8edf5;display:flex;align-items:center;gap:8px">'+
      '<span style="font-size:12px;font-weight:650;color:#1a56db">📋 产业分析报告</span>'+
      '<span style="font-size:11.5px;color:#4a5568">'+p.topic+'</span>'+
      '<span style="margin-left:auto;font-size:11px;color:'+(topicScore(p.topic)>=80?'#22c55e':'#f59e0b')+'">置信度 '+topicScore(p.topic)+'%</span>'+
      '<button onclick="downloadReport(\'full\')" style="padding:4px 10px;background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:8px;font-size:12px;color:#1a56db;cursor:pointer;font-weight:600;margin-left:6px">⬇ 下载</button>'+
    '</div>'+
    '<div style="padding:16px 18px;font-size:13px;color:#1e293b;line-height:1.8">'+
      '<p style="margin:0">'+renderMd(rs.text||'')+'</p>'+
    '</div>'+
  '</div>';
}

function generateTopicsFromKb(p){

  var allKnown=[];
  p.kb.forEach(function(k){ (k.known||[]).forEach(function(x){ allKnown.push(x); }); });
  var patterns=[
    {re:/氢能|电堆|储氢|燃料电池/, type:'补链', icon:'⚡', label:'氢能专用车产业补链',
     descFn:function(t){var m=t.match(/(\d+%)/);return m?'电堆'+m[0]+'外购，新楚风已量产':'氢能核心零部件本地空白';}},
    {re:/应急机器人|无人机|5G通信|智慧应急/, type:'补链', icon:'🚨', label:'智慧应急装备补链',
     descFn:function(t){return t.indexOf('启灵')>=0?'机器人靠启灵外采，无人机靠迅北斗':'感知层核心系统依赖外采';}},
    {re:/香菇|菌种|多糖|精深加工/, type:'精深加工', icon:'🍄', label:'香菇产业精深加工升级',
     descFn:function(t){return (t.indexOf('2家')>=0||t.indexOf('仅')>=0)?'功能成分提取仅2家布局':'香菇向高附加值延伸';}},
    {re:/底盘|动力总成|新能源配套/, type:'补链', icon:'🔧', label:'新能源专用车零部件配套',
     descFn:function(t){var m=t.match(/(\d+%)/);return m?'底盘动力总成占成本'+m[0]+'外购':'核心零部件本地空白';}},
    {re:/产业转移|承接|沿海/, type:'承接转移', icon:'🏭', label:'产业转移承接',
     descFn:function(){return '承接沿海制造业转移，利用区位成本优势';}},
  ];
  var topics=[]; var matched={};
  allKnown.forEach(function(text){
    patterns.forEach(function(pat){
      if(!matched[pat.label]&&pat.re.test(text)){
        matched[pat.label]=true;
        topics.push({label:pat.label,icon:pat.icon,type:pat.type,desc:pat.descFn(text)});
      }
    });

function fmtTs(ts){

// 从服务器拉取数据并覆盖本地（登录后调用）
function restoreFromServer(callback){
  fetch('/api/sync').then(function(r){return r.json();}).then(function(raw){
    if(!raw){ if(callback)callback(false); return; }
    // 兼容两种存储格式：
    //   扁平格式（persist()写入）: {PROJECTS:{...}, UPLOADS:{...}, ...}
    //   包装格式（历史遗留）:      {huixiaozhao_kb_v1:{PROJECTS:{...},...}, hxz_uploads:{...}}
    var srv = (raw.huixiaozhao_kb_v1 && raw.huixiaozhao_kb_v1.PROJECTS)
              ? raw.huixiaozhao_kb_v1
              : raw;
    if(!srv||!srv.PROJECTS||!Object.keys(srv.PROJECTS).length){
      if(callback)callback(false); return;
    }
    // 服务器直接覆盖本地，不做合并——保证所有人看到同一份数据
    PROJECTS         = srv.PROJECTS         || {};
    UPLOADS          = srv.UPLOADS          || {};
    KB_CONFIRMS      = srv.KB_CONFIRMS      || {};
    KB_FILE_CHUNKS   = srv.KB_FILE_CHUNKS   || {};
    KB_UNLOCKED      = srv.KB_UNLOCKED      || {};
    REPORTSTATE      = srv.REPORTSTATE      || {};
    PENDING_CONFIRMS = srv.PENDING_CONFIRMS || {};
    DOCK_LOGS        = srv.DOCK_LOGS        || {};
    if(srv.DEMANDS) window.DEMANDS=srv.DEMANDS;
    KB_CHAT          = srv.KB_CHAT          || {};
    // 历史报告：服务器有则用服务器，否则保留本地已加载的（避免旧记录被空值冲掉）
    if(srv.REPORT_HISTORY && Object.keys(srv.REPORT_HISTORY).length) REPORT_HISTORY = srv.REPORT_HISTORY;
    // 注册用户资料：合并服务器与本地(不丢本地新注册未同步的)
    if(srv.USER_PROFILES){ Object.keys(srv.USER_PROFILES).forEach(function(uk){ USER_PROFILES[uk]=srv.USER_PROFILES[uk]; }); }
    cur  = srv.cur  || Object.keys(PROJECTS)[0] || null;
    view = srv.view || 'setup';
    // 写回 localStorage（统一扁平格式）
    var flat={cur:cur,view:view,PROJECTS:PROJECTS,UPLOADS:UPLOADS,
      KB_CONFIRMS:KB_CONFIRMS,KB_FILE_CHUNKS:KB_FILE_CHUNKS,
      KB_UNLOCKED:KB_UNLOCKED,REPORTSTATE:REPORTSTATE,
      PENDING_CONFIRMS:PENDING_CONFIRMS,DOCK_LOGS:DOCK_LOGS,
      KB_CHAT:KB_CHAT,syncTs:Date.now()};
    try{localStorage.setItem(LS_KEY,JSON.stringify(flat));}catch(_){}
    try{localStorage.setItem('hxz_uploads',JSON.stringify(UPLOADS));}catch(_){}
    // 若 Postgres 是旧包装格式，顺手更新成扁平格式
    if(raw.huixiaozhao_kb_v1){
      try{fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(flat)}).catch(function(){});}catch(_){}
    }
    console.log('[sync] restored from server, projects:',Object.keys(PROJECTS).length);
    if(callback)callback(true);
  }).catch(function(){ if(callback)callback(false); });
}

function kbChatPush(role, html){
  if(!cur) return;
  if(!KB_CHAT[cur]) KB_CHAT[cur]=[];
  // 只存 bubble 内容文本，避免 data-URI 头像导致 localStorage 超限
  var text = html;
  try {
    var _tmp=document.createElement('div'); _tmp.innerHTML=html;

    text = _bub ? _bub.innerHTML : (_tmp.textContent||html);
  } catch(e){}
  // 去重：同 role + 相同文本在 3 秒内不重复存
  var last=KB_CHAT[cur][KB_CHAT[cur].length-1];
  if(last && last.role===role && last.text===text && Date.now()-last.ts<3000) return;
  KB_CHAT[cur].push({role:role, text:text, ts:Date.now()});
  // 最多保留最近 100 条，防止无限增长
  if(KB_CHAT[cur].length>100) KB_CHAT[cur]=KB_CHAT[cur].slice(-100);
  persist();
  try{updateKbConvCount();}catch(_){}
}

var _kbSuggestCache={};
function kbGenSuggestions(){
  var listEl=document.getElementById('kbSuggestList');

  var city=p.city;
  function fill(qs){
    if(!qs||!qs.length){ listEl.innerHTML='<li style="font-size:12.5px;color:#9aa5b5">· 暂无建议，直接在下方输入你的问题即可</li>'; return; }
    listEl.innerHTML=qs.map(function(q){

      return '<li style="font-size:12.5px;color:#1a56db;cursor:pointer;line-height:1.7" onclick="askKB(\''+safe+'\')">• '+q+'</li>';
    }).join('');
  }
  // 会话内缓存，避免每次渲染都重复调用
  if(_kbSuggestCache[cur]){ fill(_kbSuggestCache[cur]); return; }
  var chunks=(typeof buildKBCorpus==='function')?buildKBCorpus(city):[];
  fetch(KB_API,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({question:'请为'+city+'生成4个招商建议问题',chunks:chunks,city:city,stream:false,mode:'suggest'})
  }).then(function(r){return r.ok?r.json():null;}).then(function(j){
    var txt=(j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';

    if(qs.length){ _kbSuggestCache[cur]=qs; }

  }).catch(function(){ fill(null); });
}

/* 跨端桥接：政府端双确认递交 → upsert 一条管理端需求池记录（黄金演示动线第1→2步） */
function syncDemandFromProject(){
  var p=P();if(!p)return;
  var cl=p.clues||[];
  var domain=(cl[0]&&(cl[0].dir||'').split(' · ')[0])||p.topic.replace('补链','').replace('升级','').replace('智能化','');
  var exist=DEMANDS.find(function(d){return d.city===p.city&&d.topic===p.topic});
  var payload={
    city:p.city, gov:p.org+'·'+p.who, topic:p.topic, domain:domain,
    need:cl.map(function(c){return c.dir.split(' · ')[0]}).join(' / ')||p.topic,
    submit:'刚刚', res:'checking', resLabel:'核验中', clues:cl.length,
    note:'政府端双确认递交，等待资源端核验匹配。', fromGov:true
  };
  if(exist){Object.keys(payload).forEach(function(k){if(k!=='res'&&k!=='resLabel'&&k!=='clues')exist[k]=payload[k];});exist.submit='刚刚';}
  else{payload.id='dg'+Date.now();DEMANDS.unshift(payload);}
  // 更新城市漏斗（提交+确认各+1；若该城市不存在则新建）
  var f=CITY_FUNNEL.find(function(x){return x.city===p.city});
  if(f){f.submit++;f.confirm++;}else{CITY_FUNNEL.push({city:p.city,submit:1,confirm:1,match:0,dock:0,sign:0});}
  persist(); // 同步到服务器
}

function topicTags(t){
  if(t.indexOf('产业')>=0) return ['产业','主导','集群','链条','规模','产值'];

/* ── 2. BM25-style 检索 ── */
function kbSearch(query, chunks, topK){
  topK=topK||4;
  // 分词：中文按字/词切割，英文按空格
  function tokenize(s){
    var tokens=[];
    // 提取所有2-4字中文词组 + 数字+单位
    var m; var re=/[\u4e00-\u9fff]{2,4}|[A-Za-z0-9]+[%亿万辆元]/g;
    while((m=re.exec(s))!==null) tokens.push(m[0]);
    // 单字 fallback
    s.replace(/[\u4e00-\u9fff]/g,function(c){tokens.push(c);});
    return tokens;
  }
  var qTokens=tokenize(query);

  // IDF: log(N/df+1), TF: count/len
  var N=chunks.length;
  var df={};
  chunks.forEach(function(c){
    var seen={};
    tokenize(c.text+' '+c.topic+' '+(c.tags||[]).join(' ')).forEach(function(t){
      if(!seen[t]){df[t]=(df[t]||0)+1; seen[t]=1;}
    });
  });

  var scored=chunks.map(function(c){
    var doc=c.text+' '+c.topic+' '+(c.tags||[]).join(' ');
    var docTokens=tokenize(doc);
    var len=Math.max(docTokens.length,1);
    var score=0;
    qTokens.forEach(function(qt){
      var tf=0;
      docTokens.forEach(function(dt){ if(dt===qt||dt.indexOf(qt)>=0||qt.indexOf(dt)>=0) tf++; });
      var idf=Math.log((N+1)/((df[qt]||0)+1));
      // BM25 k1=1.5 b=0.75 avgdl=50
      var bm25=(tf*(1.5+1))/(tf+1.5*(1-0.75+0.75*len/50));
      score+=bm25*idf;
    });
    // boost: tag 精确匹配
    (c.tags||[]).forEach(function(tag){
      if(query.indexOf(tag)>=0) score+=2.5;
    });
    return {chunk:c, score:score};
  });

  scored.sort(function(a,b){return b.score-a.score;});
  return scored.slice(0,topK).filter(function(x){return x.score>0;}).map(function(x){return x.chunk;});
}

/* ── KB RAG: 流式渲染 + 追问按钮 ── */
var KB_API = '/api/kb-chat';  // 同源相对路径：线上走 Railway 后端，本地走 localhost:5050

function kbAnswerRender(container, query, chunks, city){
  // 1. 思考气泡
  var thinking = document.createElement('div');
  thinking.className = 'message';
  thinking.innerHTML = '<img src="'+aiAvatar()+'">'+
    '<div class="message-bubble" style="display:flex;align-items:center;gap:8px;color:#9aa5b5;font-size:13px">'+
    '<span class="kb-thinking-dot"></span>正在调用 AI 分析…</div>';
  container.appendChild(thinking);
  container.scrollTop = container.scrollHeight;

  // 2. 创建回答气泡（流式填充）
  var ansNode = document.createElement('div');
  ansNode.className = 'message';
  ansNode.style.display = 'none';
  var bodyDiv = document.createElement('div');
  bodyDiv.className = 'kb-stream-body';
  ansNode.innerHTML = '<img src="'+aiAvatar()+'">';
  var bubble = document.createElement('div');
  bubble.className = 'message-bubble';
  bubble.appendChild(bodyDiv);
  ansNode.appendChild(bubble);
  container.appendChild(ansNode);

  var accText = '';
  var t0 = Date.now();

  function renderMarkdown(md){
    // 简单 markdown: **bold**, - list, 表格转列表, \n段落
    var lines=md.split('\n'), out=[], tbl=[];
    function flushTbl(){
      if(!tbl.length){return;}
      var rows=tbl.filter(function(r){return !/^[\s\-:|]+$/.test(r);});
      var head=null;
      rows.forEach(function(r,ri){
        var cells=r.replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim();});
        if(ri===0){head=cells;return;}
        var pair=cells.map(function(c,ci){return (head&&head[ci]?head[ci]+'：':'')+c;}).join('，');
        out.push('- '+pair);
      });
      tbl=[];
    }
    lines.forEach(function(ln){
      if(/^\s*\|.*\|\s*$/.test(ln)){ tbl.push(ln); }
      else { flushTbl(); out.push(ln); }
    });
    flushTbl();
    return out.join('\n')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/⚠️/g,'<span style="color:#d97706">⚠️</span>')
      .replace(/^#{1,4}\s*(.+)$/gm,'<strong>$1</strong>')
      .replace(/^[-•]\s(.+)$/gm,'<li style="margin:4px 0;padding-left:4px">$1</li>')
      .replace(/(<li[\s\S]*?<\/li>)+/g,'<ul style="margin:6px 0;padding:0 0 0 18px;list-style:disc">$&</ul>')
      .replace(/\n{2,}/g,'</p><p style="margin:8px 0">')
      .replace(/\n/g,'<br>');
  }

  fetch(KB_API, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({question:query, chunks:chunks, city:city, stream:true, mode:'chat'})
  }).then(function(resp){
    thinking.remove();
    ansNode.style.display = '';

    if(!resp.ok){
      return resp.json().then(function(e){
        bodyDiv.innerHTML = '<span style="color:#ef4444">服务错误：'+(e.error||resp.status)+'</span>';
      });
    }

    var reader = resp.body.getReader();
    var decoder = new TextDecoder();
    var buf = '';

    function pump(){
      reader.read().then(function(d){
        if(d.done){
          // 完成：追加来源 + 追问
          var elapsed = Date.now()-t0;
          var cites = [...new Set(chunks.map(function(c){return c.cite;}).filter(Boolean))];
          var citeTags = cites.map(function(c){
            return '<span style="display:inline-block;padding:2px 8px;background:#f0f4ff;color:#1a56db;border-radius:12px;font-size:11px;margin:2px 3px">📌 '+c+'</span>';
          }).join('');

          // 追问按钮
          var _cy = city || (P()&&P().city) || '本市';
          var followups = [_cy+'优先补链的核心环节？', _cy+'各园区如何分工承接？', _cy+'本地链主还缺哪些关键配套？'];
          var followHtml = '<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">'+
            followups.map(function(f){
              return '<button onclick="kbSendQuestion(this,\''+f.replace(/'/g,"\\'")+'\')" '+
                'style="padding:5px 11px;background:#f5f7fb;border:1.5px solid #e8edf5;border-radius:20px;font-size:12px;color:#0b183b;cursor:pointer;transition:background .1s" '+
                'onmouseover="this.style.background=\'#eef2ff\'" onmouseout="this.style.background=\'#f5f7fb\'">'+f+'</button>';
            }).join('')+
          '</div>';

          var footer = (citeTags?'<div style="margin-top:8px">'+citeTags+'</div>':'')+
            '<div style="font-size:10.5px;color:#b0bac8;margin-top:6px">DeepSeek · 响应 '+elapsed+'ms · 检索 '+chunks.length+' 个数据块</div>'+
            followHtml+
            '<div style="margin-top:8px;padding:8px 10px;background:#f9fafb;border-radius:8px;font-size:11px;color:#9aa5b5;line-height:1.6">⚠ 以上内容基于公开信息与慧小招实测数据，园区承载、企业采购规模及领导具体交办仍需政府授权材料确认</div>';

          bubble.insertAdjacentHTML('beforeend', footer);
          container.scrollTop = container.scrollHeight;
          // 存档最终完整的 AI 回复气泡（含来源/追问/免责），刷新或切换后可回放
          kbChatPush('ai', ansNode.outerHTML);
          return;
        }

        buf += decoder.decode(d.value, {stream:true});
        var lines2 = buf.split('\n');
        buf = lines2.pop(); // 保留不完整行

        lines2.forEach(function(line){
          if(!line.startsWith('data:')) return;
          var data = line.slice(5).trim();
          if(data === '[DONE]') return;
          try{
            var j = JSON.parse(data);
            var delta = (j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content)||'';
            if(delta){
              accText += delta;
              bodyDiv.innerHTML = '<p style="margin:0;line-height:1.75">'+renderMarkdown(accText)+'</p>';
              container.scrollTop = container.scrollHeight;
            }
          }catch(e){}
        });
        pump();
      });
    }
    pump();

  }).catch(function(err){
    thinking.remove();
    ansNode.style.display = '';
    bodyDiv.innerHTML = '<span style="color:#ef4444">连接失败：'+err.message+
      '<br><small style="color:#9aa5b5">AI 服务暂时不可用，请稍后重试</small></span>';
  });
}

    var topicUploads=(KB_FILE_CHUNKS[cur]||[]).filter(function(c){

      return {id:'pin:'+i,topic:kbTopic.t,tags:topicTags(kbTopic.t),text:t,cite:kbTopic.t+'(置顶)'};
    });
    pinned.reverse().forEach(function(pc){if(seen.indexOf(pc.text)<0){chunks.unshift(pc);seen.push(pc.text);}});
    chunks=chunks.slice(0,8);
  }
  kbAnswerRender(container,query,chunks,p.city);
}

function kbRAGQuery(query, container){
  var p=P(); if(!p) return;
  var corpus=buildKBCorpus(p.city);
  var chunks=kbSearch(query, corpus, 5);
  kbAnswerRender(container, query, chunks, p.city);
}

/* 编辑框附件上传：读取文本内容填充 textarea */
function editPickFile(kbIdx,itemIdx){
  var inp=document.createElement('input');
  inp.type='file'; inp.multiple=true;
  inp.accept='.txt,.md,.csv,.pdf,.doc,.docx,.xls,.xlsx';
  inp.onchange=function(){
    var files=Array.from(inp.files||[]);
    if(!files.length)return;
    processEditFiles(files,kbIdx,itemIdx);
  };
  inp.click();
}

function editDropFile(e,kbIdx,itemIdx){
  e.preventDefault();
  var files=Array.from(e.dataTransfer&&e.dataTransfer.files||[]);
  if(!files.length)return;
  processEditFiles(files,kbIdx,itemIdx);
}

function processEditFiles(files,kbIdx,itemIdx){
  var hint=document.getElementById('kb-file-hint-'+kbIdx+'-'+itemIdx);
  var ta=document.getElementById('kb-edit-'+kbIdx+'-'+itemIdx);
  // 先触发全局 ingestFiles（更新 corpus）
  ingestFiles(files, kbIdx);
  // 然后读取文本文件内容追加到 textarea
  var textFiles=files.filter(function(f){return /\.(txt|md|csv|json)$/i.test(f.name);});
  var binary=files.filter(function(f){return !/\.(txt|md|csv|json)$/i.test(f.name);});
  // 更新 hint 文本
  if(hint)hint.textContent='✅ 已上传 '+files.length+' 个文件：'+files.map(function(f){return f.name;}).join('、');
  // binary 文件只记录名称到 textarea
  if(binary.length&&ta){
    ta.value+=(ta.value?'\n':'')+'[已上传文件：'+binary.map(function(f){return f.name;}).join('、')+'，内容已加入知识库]';
  }
  if(!textFiles.length)return;
  // 读取纯文本文件，提取摘要追加到 textarea
  var done=0;
  textFiles.forEach(function(f){
    var reader=new FileReader();
    reader.onload=function(e){
      var text=(e.target.result||'').trim();
      // 取前 500 字作为摘要
      var summary=text.slice(0,500).replace(/\n+/g,' ').trim();
      if(ta&&summary){
        ta.value+=(ta.value?'\n':'')+'['+f.name+'] '+summary;
      }
      done++;
      if(done===textFiles.length&&ta){
        ta.focus();
        ta.setSelectionRange(ta.value.length,ta.value.length);
      }
    };
    reader.readAsText(f,'utf-8');
  });
}
