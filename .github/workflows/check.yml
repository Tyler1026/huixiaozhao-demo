name: Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js-syntax-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: report_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d report_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HXZ_TEST_DATABASE_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/report_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install syntax and report test dependencies
        run: pip install esprima python-docx==1.1.2 psycopg2-binary

      - name: Verify generated frontend is unchanged
        run: python3 scripts/build_frontend.py --check

      - name: Backend reliability regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Demand submission regression tests
        run: node --test tests/test_*.cjs

      - name: Check ops.html / index.html inline <script> integrity
        run: python3 scripts/check_inline_js.py ops.html index.html

      - name: Check patch whitespace
        run: git diff --check

      - name: Build production container without running application
        run: docker build --tag hxz-refactor-check:${{ github.sha }} .

      - name: Smoke actual entrypoint in isolated container
        run: docker run --rm --network none --entrypoint python hxz-refactor-check:${{ github.sha }} scripts/smoke_entrypoint.py

      - name: Build standalone report image without enabling live research
        run: docker build -f Dockerfile.full-report --tag hxz-full-report-check:${{ github.sha }} .

      - name: Smoke standalone report imports with networking disabled
        run: docker run --rm --network none --entrypoint python hxz-full-report-check:${{ github.sha }} -c "from report_service.full_cli import parse; from report_service.full_provider import FullSyntheticProvider; from report_service.full_contract import STAGES; assert len(STAGES) == 16"
