name: Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install esprima
        run: pip install esprima

      - name: Backend reliability regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Frontend regression tests
        run: node --test tests/test_demand_submit.cjs tests/test_identity_client.cjs

      - name: Check ops.html / index.html inline <script> integrity
        run: python3 scripts/check_inline_js.py ops.html index.html

      - name: Check patch whitespace
        run: git diff --check
