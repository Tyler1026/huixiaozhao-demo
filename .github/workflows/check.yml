name: Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install esprima
        run: pip install esprima

      - name: Verify generated frontend is unchanged
        run: python3 scripts/build_frontend.py --check

      - name: Backend reliability regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Demand submission regression tests
        run: node --test tests/test_*.cjs

      - name: Check ops.html / index.html inline <script> integrity
        run: python3 scripts/check_inline_js.py ops.html index.html

      - name: Check patch whitespace
        run: git diff --check

      - name: Build production container without running application
        run: docker build --tag hxz-refactor-check:${{ github.sha }} .

      - name: Smoke actual entrypoint in isolated container
        run: docker run --rm --network none --entrypoint python hxz-refactor-check:${{ github.sha }} scripts/smoke_entrypoint.py
